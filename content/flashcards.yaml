# Flashcard deck → the Flashcards tool page (gated by features.flashcards).
# Kortene følger modulene: her ligger bare det modulene faktisk dekker, og
# stokken vokser etter hvert som flere moduler skrives.
cards:
  # ── Grunnlag ───────────────────────────────────────────────────────────────
  - front: "Hva er forskjellen på et problem og en instans?"
    back: "Problemet er relasjonen mellom input og output, for eksempel «outputen er en stigende omordning av inputen». Instansen er én bestemt input, for eksempel $\\langle 6, 8, 3, 5 \\rangle$."
    section: "Grunnlag"
  - front: "Hva koster én operasjon i RAM-modellen, og hvor brede er heltallene?"
    back: "Aritmetikk, sammenligning, hopp og oppslag i én celle koster én tidsenhet hver. Heltallene er om lag $c \\lg n$ bits brede, akkurat nok til å indeksere hele inputen."
    section: "Grunnlag"
  - front: "Skriv definisjonen av $f(n) = O(g(n))$."
    back: "Det finnes konstanter $c > 0$ og $n_0$ slik at $0 \\le f(n) \\le c\\,g(n)$ for alle $n \\ge n_0$."
    section: "Grunnlag"
  - front: "Skriv definisjonen av $f(n) = \\Theta(g(n))$."
    back: "Det finnes $c_1, c_2 > 0$ og $n_0$ slik at $0 \\le c_1 g(n) \\le f(n) \\le c_2 g(n)$ for alle $n \\ge n_0$. Altså både $O(g)$ og $\\Omega(g)$."
    section: "Grunnlag"
  - front: "Hva skiller $o$ fra $O$, og $\\omega$ fra $\\Omega$?"
    back: "$O$ og $\\Omega$ tillater at $f$ og $g$ vokser like raskt. $o$ og $\\omega$ gjør ikke det: de krever ulikheten for enhver $c > 0$, som er det samme som at $f/g$ går mot $0$ eller mot uendelig. Derfor er $2n^2 = O(n^2)$, mens $2n^2 \\ne o(n^2)$."
    section: "Grunnlag"
  - front: "Oversett de fem operatorene til sammenligning av tall."
    back: "$O$ er $a \\le b$, $\\Omega$ er $a \\ge b$, $\\Theta$ er $a = b$, $o$ er $a < b$ og $\\omega$ er $a > b$. Unntaket er at to funksjoner kan mangle et forhold helt, mens to tall alltid kan sammenlignes."
    section: "Grunnlag"
  - front: "Betyr $O$ alltid verste tilfelle?"
    back: "Nei. $O$ er en øvre grense og kan brukes på hvilken som helst kjøretidsfunksjon, også beste tilfelle. Grense og tilfelle er to uavhengige akser."
    section: "Grunnlag"
  - front: "Hva betyr det at verste tilfelle er $\\Omega(n^2)$?"
    back: "Den dyreste instansen av størrelse $n$ koster minst kvadratisk tid. Det er en nedre grense for et maksimum, på samme vis som «den høyeste i klassen er minst 1 m høy»."
    section: "Grunnlag"
  - front: "Forenkle $O(n^a) + \\Omega(n^b) + \\Theta(n^c)$."
    back: "$\\Omega(n^b + n^c)$. Summer nedre grenser ($0 + n^b + n^c$) og øvre for seg. De øvre er ubegrenset fordi $\\Omega(n^b)$ ikke setter noe tak, så bare den nedre står igjen."
    section: "Grunnlag"
  - front: "Hvorfor er $n + O(n) = O(n)$ riktig, mens $O(n) = n + O(n)$ er galt?"
    back: "Ligninger med asymptotisk notasjon leses fra venstre mot høyre, og høyresiden må være minst like generell som venstresiden. Ikke alt som er $O(n)$ kan skrives som $n$ pluss noe som er $O(n)$."
    section: "Grunnlag"
  - front: "De tre delene i et løkkeinvariant-bevis?"
    back: "Initialisering (invarianten holder før første iterasjon), vedlikehold (holder den før en iterasjon, holder den før den neste), og terminering (løkka stopper, og invarianten gir da det vi var ute etter)."
    section: "Grunnlag"
  - front: "Hva skiller svak fra sterk induksjon?"
    back: "Svak induksjon antar bare forrige trinn og passer til løkker. Sterk induksjon antar alle mindre tilfeller, og passer når en algoritme kaller seg selv på flere mindre instanser."
    section: "Grunnlag"
  - front: "Hva er løkkeinvarianten til Insertion-Sort?"
    back: "$A[0 : i]$ er sortert ved starten av hver iterasjon av for-løkka, og består av de elementene som lå der fra begynnelsen."
    section: "Grunnlag"
  - front: "Insertion-Sort i beste og i verste tilfelle?"
    back: "$\\Theta(n)$ når tabellen er sortert fra før og ingen forskyvninger trengs. $\\Theta(n^2)$ når den er sortert synkende, med $n(n-1)/2$ forskyvninger."
    section: "Grunnlag"
  - front: "Hvor stor $n$ rekker en faktoriell og en kvadratisk algoritme på hundre år, ved ett mikrosekund per operasjon?"
    back: "17 mot rundt 56 millioner. En eksponentiell algoritme kommer til 51."
    section: "Grunnlag"
