# Flashcard deck → the Flashcards tool page (gated by features.flashcards).
# Kortene følger modulene: her ligger bare det modulene faktisk dekker, og
# stokken vokser etter hvert som flere moduler skrives.
cards:
  # ── Grunnlag ───────────────────────────────────────────────────────────────
  - front: "Hva er forskjellen på et problem og en instans?"
    back: "Problemet er relasjonen mellom input og output, for eksempel «outputen er en stigende omordning av inputen». Instansen er én bestemt input, for eksempel $\\langle 6, 8, 3, 5 \\rangle$."
    section: "Grunnlag"
  - front: "Hva koster én operasjon i RAM-modellen, og hvor brede er heltallene?"
    back: "Aritmetikk, sammenligning, hopp og oppslag i én celle koster én tidsenhet hver. Heltallene er om lag $c \\lg n$ bits brede, akkurat nok til å indeksere hele inputen."
    section: "Grunnlag"
  - front: "Skriv definisjonen av $f(n) = O(g(n))$."
    back: "Det finnes konstanter $c > 0$ og $n_0$ slik at $0 \\le f(n) \\le c\\,g(n)$ for alle $n \\ge n_0$."
    section: "Grunnlag"
  - front: "Skriv definisjonen av $f(n) = \\Theta(g(n))$."
    back: "Det finnes $c_1, c_2 > 0$ og $n_0$ slik at $0 \\le c_1 g(n) \\le f(n) \\le c_2 g(n)$ for alle $n \\ge n_0$. Altså både $O(g)$ og $\\Omega(g)$."
    section: "Grunnlag"
  - front: "Hva skiller $o$ fra $O$, og $\\omega$ fra $\\Omega$?"
    back: "$O$ og $\\Omega$ tillater at $f$ og $g$ vokser like raskt. $o$ og $\\omega$ gjør ikke det: de krever ulikheten for enhver $c > 0$, som er det samme som at $f/g$ går mot $0$ eller mot uendelig. Derfor er $2n^2 = O(n^2)$, mens $2n^2 \\ne o(n^2)$."
    section: "Grunnlag"
  - front: "Oversett de fem operatorene til sammenligning av tall."
    back: "$O$ er $a \\le b$, $\\Omega$ er $a \\ge b$, $\\Theta$ er $a = b$, $o$ er $a < b$ og $\\omega$ er $a > b$. Unntaket er at to funksjoner kan mangle et forhold helt, mens to tall alltid kan sammenlignes."
    section: "Grunnlag"
  - front: "Betyr $O$ alltid verste tilfelle?"
    back: "Nei. $O$ er en øvre grense og kan brukes på hvilken som helst kjøretidsfunksjon, også beste tilfelle. Grense og tilfelle er to uavhengige akser."
    section: "Grunnlag"
  - front: "Hva betyr det at verste tilfelle er $\\Omega(n^2)$?"
    back: "Den dyreste instansen av størrelse $n$ koster minst kvadratisk tid. Det er en nedre grense for et maksimum, på samme vis som «den høyeste i klassen er minst 1 m høy»."
    section: "Grunnlag"
  - front: "Forenkle $O(n^a) + \\Omega(n^b) + \\Theta(n^c)$."
    back: "$\\Omega(n^b + n^c)$. Summer nedre grenser ($0 + n^b + n^c$) og øvre for seg. De øvre er ubegrenset fordi $\\Omega(n^b)$ ikke setter noe tak, så bare den nedre står igjen."
    section: "Grunnlag"
  - front: "Hvorfor er $n + O(n) = O(n)$ riktig, mens $O(n) = n + O(n)$ er galt?"
    back: "Ligninger med asymptotisk notasjon leses fra venstre mot høyre, og høyresiden må være minst like generell som venstresiden. Ikke alt som er $O(n)$ kan skrives som $n$ pluss noe som er $O(n)$."
    section: "Grunnlag"
  - front: "De tre delene i et løkkeinvariant-bevis?"
    back: "Initialisering (invarianten holder før første iterasjon), vedlikehold (holder den før en iterasjon, holder den før den neste), og terminering (løkka stopper, og invarianten gir da det vi var ute etter)."
    section: "Grunnlag"
  - front: "Hva skiller svak fra sterk induksjon?"
    back: "Svak induksjon antar bare forrige trinn og passer til løkker. Sterk induksjon antar alle mindre tilfeller, og passer når en algoritme kaller seg selv på flere mindre instanser."
    section: "Grunnlag"
  - front: "Hva er løkkeinvarianten til Insertion-Sort?"
    back: "$A[0 : i]$ er sortert ved starten av hver iterasjon av for-løkka, og består av de elementene som lå der fra begynnelsen."
    section: "Grunnlag"
  - front: "Insertion-Sort i beste og i verste tilfelle?"
    back: "$\\Theta(n)$ når tabellen er sortert fra før og ingen forskyvninger trengs. $\\Theta(n^2)$ når den er sortert synkende, med $n(n-1)/2$ forskyvninger."
    section: "Grunnlag"
  - front: "Hvor stor $n$ rekker en faktoriell og en kvadratisk algoritme på hundre år, ved ett mikrosekund per operasjon?"
    back: "17 mot rundt 56 millioner. En eksponentiell algoritme kommer til 51."
    section: "Grunnlag"
  # ── Datastrukturer ─────────────────────────────────────────────────────────
  - front: "Hvorfor koster indeksering i en tabell konstant tid?"
    back: "Tabellen ligger sammenhengende i minnet, så element $i$ ligger på adresse $a + b(i - s)$: ett gangestykke og én addisjon, uansett størrelse."
    section: "Datastrukturer"
  - front: "Stakk og kø: hva er forskjellen?"
    back: "Stakken er sist inn, først ut, med <code>Push</code> og <code>Pop</code> på toppen. Køen er først inn, først ut, med <code>Enqueue</code> bakerst og <code>Dequeue</code> forrest."
    section: "Datastrukturer"
  - front: "Hvordan får en kø plass i en tabell med fast lengde, uten at noe flyttes?"
    back: "Som ringbuffer: <code>head</code> peker på den første i køen og <code>tail</code> på neste ledige plass, og begge går rundt til starten når de passerer enden."
    section: "Datastrukturer"
  - front: "Hva koster søk, innsetting og sletting i en lenket liste?"
    back: "Søk er $\\Theta(n)$: pekerne må følges fra hodet. Innsetting og sletting er $\\Theta(1)$, men bare når du allerede står ved noden."
    section: "Datastrukturer"
  - front: "Hva er kjeding i en hashtabell?"
    back: "Hver plass i tabellen holder en lenket liste, og alle nøkler som hasher dit, settes inn forrest i lista. Kollisjoner koster dermed bare lengre lister."
    section: "Datastrukturer"
  - front: "Forventet og verste søketid i en hashtabell med kjeding?"
    back: "Forventet $\\Theta(1 + \\alpha)$ med belastningsfaktor $\\alpha = n/m$ og jevn fordeling; konstant når $m = \\Theta(n)$. Verste tilfelle $\\Theta(n)$: alle nøklene kan havne på samme plass."
    section: "Datastrukturer"
  - front: "Hva er perfekt hashing, og når kan den brukes?"
    back: "En hashfunksjon skreddersydd en statisk nøkkelmengde, uten kollisjoner. Søk tar garantert konstant tid, men nøklene må være kjent på forhånd."
    section: "Datastrukturer"
  - front: "Hvorfor er tabelldobling amortisert konstant per innsetting?"
    back: "$n$ innsettinger koster $n$ skrivinger pluss kopieringene $1 + 2 + 4 + \\cdots + n/2 = n - 1$, totalt $2n - 1$. Delt på $n$ operasjoner er det under 2 per innsetting."
    section: "Datastrukturer"
  - front: "Amortisert kjøretid og gjennomsnittstilfellet: hva er forskjellen?"
    back: "Amortisering er et snitt over operasjonene i en følge, i verste fall og uten sannsynlighet. Gjennomsnittstilfellet er et snitt over instanser, med en sannsynlighetsfordeling."
    section: "Datastrukturer"
  # ── Problemer og reduksjoner ───────────────────────────────────────────────
  - front: "Søke-, beslutnings- og optimeringsvarianten av CLIQUE?"
    back: "Søk: finn en klikk med $k$ noder. Beslutning: finnes en klikk med $k$ noder? Optimering: finn en størst mulig klikk."
    section: "Problemer og reduksjoner"
  - front: "Hva er et sertifikat?"
    back: "En påstått løsning $y$ som verifiseres mot instansen: sjekk om $(x, y) \\in R$. Ofte langt billigere enn å finne løsningen, som når en permutasjon sjekkes i lineær tid mens sortering krever $\\Omega(n \\lg n)$ sammenligninger."
    section: "Problemer og reduksjoner"
  - front: "Cook-, Levin- og Karp-reduksjoner: hva skiller dem?"
    back: "Cook: vilkårlig mange orakelkall og eget polynomisk arbeid. Levin: ett kall, og løsningen oversettes tilbake. Karp: ett kall for beslutningsproblemer, ja/nei går uendret gjennom. Hver er et spesialtilfelle av den forrige."
    section: "Problemer og reduksjoner"
  - front: "Du reduserer $X$ billig til $Y$. Hva vet du om vanskegraden?"
    back: "$Y$ er minst like vanskelig som $X$: en effektiv algoritme for $Y$ gir en for $X$, og kan ikke $X$ løses effektivt, kan heller ikke $Y$."
    section: "Problemer og reduksjoner"
  - front: "De tre delene i et dekomponeringsdesign, og hva som må gjelde i tillegg?"
    back: "Grunntilfelle som løses direkte, induksjonshypotese om at delinstansene kan løses, og et induksjonssteg som dekomponerer og kombinerer riktig. I tillegg må instansene krympe, så rekursjonen terminerer."
    section: "Problemer og reduksjoner"
  - front: "Insertion-Sort som dekomponering?"
    back: "Kutt av siste element, sorter resten etter induksjonshypotesen, og sett elementet inn på rett plass. Alt arbeidet ligger i kombinasjonen; selection sort er speilbildet, med arbeidet i dekomponeringen."
    section: "Problemer og reduksjoner"
