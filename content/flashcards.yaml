# Flashcard deck → the Flashcards tool page (gated by features.flashcards).
# Curated for repetisjon: kjernebegreper, kjøretider og «hvorfor»-kort.
cards:
  # ── Grunnlag ───────────────────────────────────────────────────────────────
  - front: "Hva betyr $f(n) = \\Theta(g(n))$?"
    back: "$g$ er både en øvre og en nedre asymptotisk grense for $f$ — en stram grense."
    section: "Grunnlag"
  - front: "Betyr $O$ alltid worst-case?"
    back: "Nei. $O$ er en øvre grense og kan beskrive hvilken som helst kjøretidsfunksjon — også best-case. Grense og tilfelle er uavhengige akser."
    section: "Grunnlag"
  - front: "De tre stegene i et løkkeinvariant-bevis?"
    back: "Initialisering (sann før løkka), vedlikehold (bevares av hver iterasjon), avslutning (gir ønsket resultat når løkka stopper)."
    section: "Grunnlag"
  - front: "Hvilken vei går en reduksjon for å vise at $X$ er vanskelig?"
    back: "Fra et kjent vanskelig problem TIL $X$. Da ville en rask løsning på $X$ også løst det kjente vanskelige problemet."
    section: "Grunnlag"
  # ── Splitt og hersk ────────────────────────────────────────────────────────
  - front: "De tre stegene i splitt og hersk?"
    back: "Del (splitt instansen), hersk (løs delinstansene rekursivt), kombiner (sett sammen delsvarene)."
    section: "Splitt og hersk"
  - front: "Tre måter å løse en rekurrens?"
    back: "Substitusjon (gjett + induksjon), rekursjonstre, og masterteoremet."
    section: "Splitt og hersk"
  - front: "Kjøretid og rekurrens for Merge-Sort?"
    back: "$T(n) = 2T(n/2) + \\Theta(n) = \\Theta(n \\lg n)$."
    section: "Splitt og hersk"
  - front: "Worst-case for Quicksort, og når inntreffer det?"
    back: "$\\Theta(n^2)$, ved maksimalt skjeve partisjoner (f.eks. allerede sortert input med dårlig pivot). Forventet $\\Theta(n \\lg n)$."
    section: "Splitt og hersk"
  # ── Sortering ──────────────────────────────────────────────────────────────
  - front: "Nedre grense for sammenligningsbasert sortering?"
    back: "$\\Omega(n \\lg n)$ i worst-case — fordi $n!$ rekkefølger må skilles i et beslutningstre med høyde $\\geq \\lg(n!)$."
    section: "Sortering"
  - front: "Hva er stabil sortering, og hvorfor trenger Radix-Sort den?"
    back: "Like nøkler beholder relativ rekkefølge. Radix sorterer siffer for siffer, så lavere siffer må ikke ødelegges når et høyere siffer sorteres."
    section: "Sortering"
  - front: "Kjøretid for Counting-Sort?"
    back: "$\\Theta(n + k)$ der $k$ er tallområdet. Lineær når $k = O(n)$; ikke sammenligningsbasert."
    section: "Sortering"
  - front: "Insertion-Sort: best- og worst-case?"
    back: "Best $\\Theta(n)$ (nær sortert), worst $\\Theta(n^2)$ (omvendt sortert). In-place og stabil."
    section: "Sortering"
  # ── Datastrukturer ─────────────────────────────────────────────────────────
  - front: "Haug-egenskapen i en maks-haug?"
    back: "Hver forelder er $\\geq$ begge barna. Lokal egenskap — ikke total sortering."
    section: "Datastrukturer"
  - front: "Hvorfor er Build-Max-Heap $O(n)$ og ikke $O(n \\lg n)$?"
    back: "De fleste nodene er nær bladnivå med liten høyde; summen $\\sum_h n/2^{h+1}\\,O(h)$ konvergerer til $O(n)$."
    section: "Datastrukturer"
  - front: "Søketre-egenskapen (BST)?"
    back: "For hver node: alt i venstre deltre $<$ noden $<$ alt i høyre deltre, rekursivt."
    section: "Datastrukturer"
  - front: "Forventet høyde for et tilfeldig bygget BST med $n$ noder?"
    back: "$O(\\lg n)$. Men worst-case (sortert innsetting) gir høyde $\\Theta(n)$ — derfor balanserte trær."
    section: "Datastrukturer"
  # ── Designmetoder ──────────────────────────────────────────────────────────
  - front: "Når lønner dynamisk programmering seg?"
    back: "Når delinstansene OVERLAPPER (samme delproblem trengs flere ganger) og problemet har optimal delstruktur."
    section: "Designmetoder"
  - front: "Memoisering vs. bottom-up?"
    back: "Memoisering = top-down rekursjon som husker svar. Bottom-up = iterativ fylling av tabellen i avhengighetsrekkefølge. Samme delproblemer."
    section: "Designmetoder"
  - front: "Hva må bevises for en grådig algoritme?"
    back: "Grådighetsegenskapen (et lokalt valg er trygt) OG optimal delstruktur (resten er fortsatt et optimalt delproblem)."
    section: "Designmetoder"
  - front: "Hvorfor er $\\Theta(nW)$-DP-en for ryggsekk ikke polynomisk?"
    back: "$W$ kodes med $\\lg W$ bit, så $\\Theta(nW)$ er eksponensiell i instansens størrelse — pseudopolynomisk."
    section: "Designmetoder"
  # ── Grafer ─────────────────────────────────────────────────────────────────
  - front: "Kjøretid for BFS og DFS med nabolister?"
    back: "$O(V + E)$ — hver node og kant behandles konstant antall ganger."
    section: "Grafer"
  - front: "Hvorfor finner BFS korteste vei i uvektede grafer?"
    back: "FIFO-køen behandler alle noder på avstand $k$ før avstand $k+1$, så lagene utforskes i avstandsrekkefølge."
    section: "Grafer"
  - front: "Hva gjør $\\text{Relax}(u, v)$?"
    back: "Hvis $d[v] > d[u] + w(u,v)$, sett $d[v] \\leftarrow d[u] + w(u,v)$ og oppdater forgjengeren. Kjernen i alle korteste-vei-algoritmene."
    section: "Grafer"
  - front: "Når er en kant «trygg» i MST-bygging?"
    back: "Når den er en lettest kant over et snitt som respekterer kantene valgt så langt — da finnes et optimalt MST som inneholder den."
    section: "Grafer"
  - front: "Dijkstra vs. Bellman-Ford — forskjellen?"
    back: "Dijkstra: $O((V+E)\\lg V)$, krever ikke-negative vekter. Bellman-Ford: $O(VE)$, tåler negative kanter og oppdager negative sykler."
    section: "Grafer"
  - front: "DP-ideen i Floyd-Warshall?"
    back: "Lag $k$: korteste vei når bare noder $1..k$ tillates som mellomliggende. Bygg opp $k = 0,1,\\dots,V$. Totalt $\\Theta(V^3)$."
    section: "Grafer"
  - front: "Hva er restnettet i maks-flyt?"
    back: "Grafen over hvor flyt kan endres gitt dagens flyt. Bakoverkanter lar oss angre tidligere flyt; forøkende stier finnes her."
    section: "Grafer"
  - front: "Hva sier maks-flyt/min-snitt-teoremet?"
    back: "Verdien av en maksimal flyt = kapasiteten til et minimalt snitt. En flyt er maksimal nettopp når restnettet ikke har noen forøkende sti."
    section: "Grafer"
  # ── Kompleksitet ───────────────────────────────────────────────────────────
  - front: "Hva kreves for å vise at et problem er NP-komplett?"
    back: "(1) Vis at det ligger i NP (rask verifikasjon), og (2) vis at det er NP-hardt (reduksjon fra et kjent NP-komplett problem)."
    section: "Kompleksitet"
  - front: "Hva er en Karp-reduksjon?"
    back: "En polynomisk transformasjon av instanser fra ett beslutningsproblem til et annet som bevarer ja/nei-svaret (mange-til-én)."
    section: "Kompleksitet"
