# course.yaml — TDT4120 Algoritmer og datastrukturer
#
# The spine of the course: identity, the upcoming exam, the reference formula
# set, the glossary, and the past-exam archive. Prose lives in sections/*.mdx;
# everything data-driven (Formelsamling, Begreper, Eksamen, Flashcards) is
# generated from this file. See AUTHORING.md in the framework repo.
# ─────────────────────────────────────────────────────────────────────────────

schemaVersion: 1

