subtitle: Interaktiv pensumguide
term: H2026
language: nb

# ── Brand accent (vermillion — the original guide's single strong colour) ────
accent: "#c2412a" # light mode
accentDark: "#e8836b" # dark mode (lighter so links read on the dark ground)

# ── Official course page (NTNU emneside) ─────────────────────────────────────
courseUrl: "https://www.ntnu.no/studier/emner/TDT4120"

# ── Upcoming exam ────────────────────────────────────────────────────────────
# `date` is intentionally omitted until the official H2026 date is published —
# never seed a placeholder (these pages are a source of truth). Add it as
# `date: YYYY-MM-DD` once NTNU's exam schedule confirms it.
# Exam metadata — verified against the NTNU emneside (…/TDT4120#tab=omEksamen),
# the source of truth: "Vurderingsordning: Skriftlig skoleeksamen", "Varighet
# 4 timer", "Hjelpemiddel Kode E" (= ingen hjelpemidler tillatt).
exam:
  durationMinutes: 240
  format: Skriftlig skoleeksamen
  aids: "Hjelpemiddelkode E — ingen hjelpemidler tillatt"
  formulaSheet: false # kode E (ingen hjelpemidler) — no sheet handed out at the exam

# ── Reference formulas → Formelsamling page + inline <FormulaRef id="…"> ──────
# Algoritmekurs: dette er kjøretider, grenser og rekurrenser snarere enn
# klassiske formler. KaTeX i YAML må dobbelt-quotes med doble bakstreker.
formulas:
  - {
      tex: "T(n) = aT(n/b) + f(n)",
      label: "Masterteoremets rekurrensform",
      section: "Asymptotikk og rekurrenser",
      id: master,
    }
  - {
      tex: "T(n) = 2T(n/2) + \\Theta(n) = \\Theta(n \\lg n)",
      label: "Balansert splitt og hersk (Merge-Sort)",
      section: "Asymptotikk og rekurrenser",
      id: merge-rek,
    }
  - {
      tex: "\\Omega(n \\lg n)",
      label: "Nedre grense for sammenligningsbasert sortering",
      section: "Sortering",
      id: sammenlign-nedre,
    }
  - {
      tex: "O(n)",
      label: "Build-Max-Heap bygger en haug i lineær tid (ikke $O(n \\lg n)$)",
      section: "Datastrukturer",
      id: bygg-haug,
    }
  - {
      tex: "O(V + E)",
      label: "BFS og DFS med naboliste-representasjon",
      section: "Grafer",
      id: graf-traversering,
    }
  - {
      tex: "d[v] \\leftarrow \\min\\{\\, d[v],\\; d[u] + w(u,v) \\,\\}",
      label: "Kantoppdatering (Relax)",
      section: "Grafer",
      id: relax,
    }
  - {
      tex: "O((V + E) \\lg V)",
      label: "Dijkstra med binær min-haug",
      section: "Grafer",
      id: dijkstra-tid,
    }
  - {
      tex: "O(V E)",
      label: "Bellman-Ford (tåler negative kanter)",
      section: "Grafer",
      id: bellman-ford-tid,
    }
  - {
      tex: "\\Theta(V^3)",
      label: "Floyd-Warshall (alle-til-alle korteste veier)",
      section: "Grafer",
      id: floyd-warshall-tid,
    }
  - {
      tex: "\\Theta(n W)",
      label: "Binært ryggsekk-DP — pseudopolynomisk i kapasiteten $W$",
      section: "Kompleksitet",
      id: knapsack-dp,
    }

# ── Glossary → Begreper page + inline <Term name="…"> ────────────────────────
glossary:
  - {
      term: "Asymptotisk notasjon",
      definition: "Et presist språk for øvre og nedre grenser på vekst. Notasjonen beskriver funksjoner, ikke bare bestemte tilfeller som worst-case: $O$ gir øvre grense, $\\Omega$ nedre, og $\\Theta$ en stram grense.",
      section: "Grunnlag",
    }
  - {
      term: "RAM-modellen",
      definition: "En idealisert maskinmodell der grunnleggende operasjoner og tilgang til én celle tar konstant tid. Den gjør kjøretidsanalyse sammenlignbar på tvers av maskiner.",
      section: "Grunnlag",
    }
  - {
      term: "Problem og instans",
      definition: "Et problem er den generelle oppgaven; en instans er én konkret input. Problemstørrelsen er målet vi analyserer kjøretiden mot.",
      section: "Grunnlag",
    }
  - {
      term: "Løkkeinvariant",
      definition: "En påstand som er sann før og etter hver iterasjon. Bevises med <b>initialisering</b>, <b>vedlikehold</b> og <b>avslutning</b>, og brukes til å vise at løkken bygger riktig resultat.",
      section: "Grunnlag",
    }
  - {
      term: "Induksjon",
      definition: "Bevismetode der grunntilfeller etableres først, og større tilfeller begrunnes ved å anta at mindre tilfeller fungerer.",
      section: "Grunnlag",
    }
  - {
      term: "Reduksjon",
      definition: "En transformasjon som lar oss løse eller sammenligne problemer ved å bruke en løsning på et annet problem. For å vise at $X$ er vanskelig reduserer vi <em>fra</em> et kjent vanskelig problem <em>til</em> $X$.",
      section: "Grunnlag",
    }
  - {
      term: "Splitt og hersk",
      definition: "Del instansen i mindre delinstanser, løs dem rekursivt, og kombiner resultatene når det trengs.",
      section: "Splitt og hersk",
    }
  - {
      term: "Rekurrens",
      definition: "En ligning for kjøretid uttrykt ved kjøretiden til mindre instanser. Løses med substitusjon, rekursjonstrær eller masterteoremet.",
      section: "Splitt og hersk",
    }
  - {
      term: "Nedre grense for sammenligningssortering",
      definition: "Alle sammenligningsbaserte sorteringsalgoritmer må skille mellom $n!$ mulige rekkefølger, som krever $\\Omega(n \\lg n)$ sammenligninger i verste fall.",
      section: "Sortering",
    }
  - {
      term: "Stabil sortering",
      definition: "Like elementer beholder relativ rekkefølge. Avgjørende når sortering gjentas på flere nøkler, som i radix-sortering.",
      section: "Sortering",
    }
  - {
      term: "Haug",
      definition: "Et nesten komplett tre lagret kompakt i en tabell, der forelderen har prioritet over barna. Brukes ofte som prioritetskø.",
      section: "Datastrukturer",
    }
  - {
      term: "Binært søketre",
      definition: "Et tre der alt i venstre deltre er mindre enn rota og alt i høyre deltre er større — rekursivt for alle noder.",
      section: "Datastrukturer",
    }
  - {
      term: "Dynamisk programmering",
      definition: "Brukes når delinstanser overlapper. Vi lagrer delløsninger og beregner dem i en rekkefølge som respekterer avhengighetene i delinstansgrafen.",
      section: "Designmetoder",
    }
  - {
      term: "Grådig valg",
      definition: "Et lokalt valg som kan inngå i en optimal løsning. Riktig grådighet krever også optimal delstruktur.",
      section: "Designmetoder",
    }
  - {
      term: "Binært ryggsekkproblem",
      definition: "Velg hele gjenstander med verdi og vekt under en kapasitet. Den klassiske DP-en er $\\Theta(nW)$, men dette er <em>pseudopolynomisk</em> — ikke polynomisk i instansens størrelse.",
      section: "Designmetoder",
    }
  - {
      term: "Graftraversering",
      definition: "Systematisk utforsking av noder ved å holde orden på oppdagede, men ikke ferdigbehandlede noder.",
      section: "Grafer",
    }
  - {
      term: "Bredde-først-søk",
      definition: "Traverserer lag for lag fra startnoden. I uvektede grafer gir dette korteste veier målt i antall kanter.",
      section: "Grafer",
    }
  - {
      term: "Dybde-først-søk",
      definition: "Følger én gren dypt før den rygger tilbake. Tidsstempler og foreldre gir struktur til topologisk sortering og sterkt sammenhengende komponenter.",
      section: "Grafer",
    }
  - {
      term: "Disjunkte mengder",
      definition: "En datastruktur for å vedlikeholde en partisjon av elementer, med operasjonene Make-Set, Find-Set og Union. Kalles også union-find.",
      section: "Grafer",
    }
  - {
      term: "Minimalt spenntre",
      definition: "Et sett kanter som kobler alle noder uten sykler og med lavest mulig total vekt.",
      section: "Grafer",
    }
  - {
      term: "Kantoppdatering",
      definition: "Forsøk på å forbedre et avstandsestimat ved å gå via én kant. Dette er kjernen i Bellman-Ford, DAG-korteste veier og Dijkstra.",
      section: "Grafer",
    }
  - {
      term: "Dijkstras algoritme",
      definition: "Velger alltid noden med lavest avstandsestimat. Korrektheten avhenger av at kantvektene ikke er negative.",
      section: "Grafer",
    }
  - {
      term: "Alle-til-alle korteste veier",
      definition: "Finn korteste veier mellom alle par av noder. Tette grafer gjør dynamisk programmering spesielt nyttig her.",
      section: "Grafer",
    }
  - {
      term: "Maksimal flyt",
      definition: "Send mest mulig flyt fra kilde til sluk uten å bryte kapasiteter eller flytbevaring.",
      section: "Grafer",
    }
  - {
      term: "Restnett",
      definition: "Grafen over hvor flyt kan økes, reduseres eller flyttes. Forøkende stier finnes i restnettet, og bakoverkanter representerer muligheten til å angre tidligere flyt.",
      section: "Grafer",
    }
  - {
      term: "NP-kompletthet",
      definition: "Et NP-komplett beslutningsproblem ligger i NP og er minst like vanskelig som alle problemer i NP under polynomiske reduksjoner.",
      section: "Kompleksitet",
    }
  - {
      term: "Karp-reduksjon",
      definition: "En polynomisk transformasjon fra én beslutningsinstans til en annen, slik at ja/nei-svaret bevares. Kalles også mange-til-én-reduksjon.",
      section: "Kompleksitet",
    }

