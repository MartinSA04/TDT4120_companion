# ── Reference formulas → Formelsamling page + inline <FormulaRef id="…"> ──────
# Bare identiteter og resultater du regner med. Definisjonene av O, Omega,
# Theta, o og omega er nettopp definisjoner, ikke formler: de hører hjemme i
# modulens <Statement kind="definition"> og i `glossary` under (AUTHORING.md §9).
# KaTeX i YAML må dobbelt-quotes med doble bakstreker.
# Listen vokser med modulene: her ligger bare det modulene faktisk dekker.
formulas:
  - {
      tex: "O(n^a) + \\Omega(n^b) + \\Theta(n^c) = \\Omega(n^b + n^c)",
      label: "Summer øvre og nedre grenser hver for seg. Står vi igjen med bare en nedre grense, skrives den med $\\Omega$.",
      section: "Asymptotisk notasjon",
      id: sum-grenser,
    }
  - {
      tex: "\\sum_{k=1}^{n-1} k = \\dfrac{n(n-1)}{2} = \\Theta(n^2)",
      label: "Trekanttall, og antall forskyvninger i verste tilfelle for Insertion-Sort",
      section: "Insertion-Sort",
      id: trekanttall,
    }
  - {
      tex: "\\sum_{i=0}^{h-1} 2^i = 2^h - 1",
      label: "Toerpotens-summen: $1 + 2 + 4 + \\cdots + n/2 = n - 1$ når $n = 2^h$. Det totale kopieringsarbeidet i tabelldobling.",
      section: "Tabelldobling",
      id: toerpotenser,
    }

  - {
      tex: "a^{\\log_b n} = n^{\\log_b a}",
      label: "Antall løvnoder i rekursjonstreet til $T(n) = aT(n/b) + f(n)$, skrevet som en potens av $n$. Ta logaritmen på begge sider: $\\log_b n \\cdot \\log a = \\log_b a \\cdot \\log n$.",
      section: "Splitt og hersk",
      id: log-bytte,
    }
  - {
      tex: "T(n) = T(n/2) + 1 = \\lg n + 1 = \\Theta(\\lg n)",
      label: "Binærsøk: ett kall på halve instansen pluss konstant arbeid. Argumentet halveres per ekspansjon, så det trengs $\\lg n$ ekspansjoner.",
      section: "Splitt og hersk",
      id: binaersok-rekurrens,
    }
  - {
      tex: "T(n) = 2T(n/2) + n = n \\lg n + n = \\Theta(n \\lg n)",
      label: "Merge-Sort: rekursjonstreet har $\\lg n + 1$ nivåer som hvert koster $n$.",
      section: "Splitt og hersk",
      id: merge-sort-rekurrens,
    }
  - {
      tex: "T(n) = T(n-1) + n = \\dfrac{n(n+1)}{2} = \\Theta(n^2)",
      label: "Quicksort i verste tilfelle: pivoten står alene på hvert nivå, og nivåkostnadene $n, n-1, \\ldots, 1$ summerer til trekanttallet.",
      section: "Splitt og hersk",
      id: quicksort-verste,
    }
  - {
      tex: "T(n) = aT(n/b) + f(n) \\implies T(n) = \\begin{cases} \\Theta(n^{\\log_b a}) & f(n) = O(n^{\\log_b a - \\epsilon}) \\\\ \\Theta(n^{\\log_b a} \\lg^{k+1} n) & f(n) = \\Theta(n^{\\log_b a} \\lg^{k} n) \\\\ \\Theta(f(n)) & f(n) = \\Omega(n^{\\log_b a + \\epsilon}) \\end{cases}",
      label: "Masterteoremet. Sammenlign $f(n)$ med vannskillefunksjonen $n^{\\log_b a}$; avstanden må være en faktor $n^\\epsilon$ i tilfelle 1 og 3, og tilfelle 3 krever i tillegg $a f(n/b) \\le c f(n)$ for en $c < 1$.",
      section: "Splitt og hersk",
      id: masterteoremet,
    }

  - {
      tex: "n! > (n/e)^n \\implies \\lg n! > n \\lg n - n \\lg e = \\Omega(n \\lg n)",
      label: "Sorteringsgrensen. Et beslutningstre med $n!$ løvnoder har høyde minst $\\lg n!$, og Stirlings formel gir $n! > (n/e)^n$. Enhver sammenligningsbasert sortering bruker $\\Omega(n \\lg n)$ sammenligninger i verste tilfelle.",
      section: "Rangering i lineær tid",
      id: sorteringsgrensen,
    }
  - {
      tex: "T(n) = T(n/2) + n = 2n - 1 = \\Theta(n)",
      label: "Randomized-Select når pivoten deler på midten: ett kall på halve instansen pluss lineært arbeid, en geometrisk sum $n + n/2 + \\cdots + 1$. Forventet kjøretid er $\\Theta(n)$ for enhver input; verste tilfelle er $\\Theta(n^2)$.",
      section: "Rangering i lineær tid",
      id: randomized-select-rekurrens,
    }
  - {
      tex: "T(n) \\le T(n/5) + T(7n/10) + \\Theta(n) = \\Theta(n)",
      label: "Select. Medianen av gruppemedianene garanterer at minst $3n/10$ elementer ligger på hver side av pivoten, så det rekursive kallet får høyst $7n/10$. Kallene får til sammen $9n/10 < n$, og rota dominerer.",
      section: "Rangering i lineær tid",
      id: select-rekurrens,
    }
  - {
      tex: "T(n) = \\Theta(n + k)",
      label: "Counting-Sort på $n$ heltall i området $0 .. k$: to løkker over $A$ og én over $C$. Lineær når $k = O(n)$.",
      section: "Rangering i lineær tid",
      id: counting-sort-kjoretid,
    }
  - {
      tex: "T(n) = \\Theta(d(n + k))",
      label: "Radix-Sort: $d$ siffer, hvert med $k + 1$ mulige verdier, sortert stabilt ett siffer om gangen med Counting-Sort.",
      section: "Rangering i lineær tid",
      id: radix-sort-kjoretid,
    }


  - {
      tex: "\\begin{aligned} \\text{Left}(i) &= 2i \\\\ \\text{Right}(i) &= 2i + 1 \\\\ \\text{Parent}(i) &= \\lfloor i/2 \\rfloor \\end{aligned}",
      label: "Haugen som tabell, nummerert nivå for nivå med rota som 1. Med indekser fra 0 blir barna $2i + 1$ og $2i + 2$ og forelderen $\\lfloor (i - 1)/2 \\rfloor$.",
      section: "Rotfaste trestrukturer",
      id: haug-indekser,
    }
  - {
      tex: "2^h \\le n \\le 2^{h+1} - 1",
      label: "Antall elementer i en haug med høyde $h$: nivåene over det nederste er fulle, og det nederste har fra 1 til $2^h$ noder. Altså er $h = \\lfloor \\lg n \\rfloor$.",
      section: "Rotfaste trestrukturer",
      id: haug-hoyde,
    }
  - {
      tex: "\\sum_{k=0}^{\\lfloor \\lg n \\rfloor} \\left\\lceil \\dfrac{n}{2^{k+1}} \\right\\rceil O(k) = O(n)",
      label: "Build-Max-Heap. Høyst $\\lceil n/2^{k+1} \\rceil$ noder har høyde $k$, og hver av dem synker høyst $k$ steg. Summen er $O(n \\sum_{k \\ge 0} k/2^k) = O(2n)$, for $\\sum_{k \\ge 0} k x^k = x/(1-x)^2$. Ikke det samme som $n$ innsettinger, som koster $\\Theta(n \\lg n)$.",
      section: "Rotfaste trestrukturer",
      id: build-max-heap-kjoretid,
    }
  - {
      tex: "\\begin{aligned} T(n) &= \\Theta(n) + (n - 1) \\cdot O(\\lg n) \\\\ &= O(n \\lg n) \\end{aligned}",
      label: "Heapsort: bygg haugen i lineær tid, og ta ut maksimum $n - 1$ ganger med Max-Heapify på $O(\\lg n)$ hver. $\\Theta(n \\lg n)$ i verste tilfelle og $\\Theta(n)$ i beste, når alle elementene er like.",
      section: "Rotfaste trestrukturer",
      id: heapsort-kjoretid,
    }

# ── Glossary → Begreper page + inline <Term name="…"> ────────────────────────
# Vokser med modulene, på samme vis som formlene over.
glossary:
  - {
      term: "Problem og instans",
      definition: "Et problem er relasjonen mellom input og output. En instans er én bestemt input. Problemstørrelsen $n$ er plassen en instans trenger, som regel antall elementer.",
      section: "Grunnlag",
    }
  - {
      term: "RAM-modellen",
      definition: "<em>Random-access machine</em>: en idealisert maskin der aritmetikk, sammenligning, hopp og oppslag i én celle koster én tidsenhet hver, og instruksjonene utføres etter hverandre. Heltallene er om lag $c \\lg n$ bits brede.",
      section: "Grunnlag",
    }
  - {
      term: "Asymptotisk notasjon",
      definition: "Et språk for vekst som ser bort fra konstantfaktorer og lavere ordens ledd. Oppfører seg som sammenligning av tall: $O$ er $\\le$, $\\Omega$ er $\\ge$, $\\Theta$ er $=$, $o$ er $<$ og $\\omega$ er $>$. De to siste krever ulikheten for enhver konstant $c > 0$, ikke bare for én.",
      section: "Grunnlag",
    }
  - {
      term: "Beste, verste og gjennomsnittlige tilfelle",
      definition: "Tre funksjoner av $n$: kjøretiden for den billigste instansen av størrelse $n$, for den dyreste, og middelet over alle. Hvilket tilfelle det gjelder er uavhengig av hvilken asymptotisk operator som brukes på det.",
      section: "Grunnlag",
    }
  - {
      term: "Løkkeinvariant",
      definition: "En påstand om tilstanden som holder ved starten av hver iterasjon. Vises med <b>initialisering</b>, <b>vedlikehold</b> og <b>terminering</b>, og er induksjonsbeviset for at løkka er korrekt.",
      section: "Grunnlag",
    }
  - {
      term: "Insertion-Sort",
      definition: "Sorterer ved å holde $A[0 : i]$ sortert og sette $A[i]$ inn på rett plass i det utsnittet. Bruker $\\Theta(n)$ i beste tilfelle og $\\Theta(n^2)$ i verste, og sorterer på plass.",
      section: "Grunnlag",
    }
  - {
      term: "Stakk",
      definition: "Sist inn, først ut (LIFO). Alt skjer på toppen: <code>Push</code> legger på og <code>Pop</code> tar av, begge i konstant tid. Implementeres med en tabell og en toppindeks.",
      section: "Datastrukturer",
    }
  - {
      term: "Kø",
      definition: "Først inn, først ut (FIFO). <code>Enqueue</code> legger til bakerst og <code>Dequeue</code> tar ut forrest, begge i konstant tid. Implementeres gjerne som ringbuffer: en tabell der indeksene <code>head</code> og <code>tail</code> rykker fremover og går rundt til starten når de passerer enden.",
      section: "Datastrukturer",
    }
  - {
      term: "Lenket liste",
      definition: "Noder som peker på neste node, og i en dobbeltlenket liste også på forrige. Innsetting og sletting koster konstant tid når du står ved noden; søk følger pekerne og koster lineær tid.",
      section: "Datastrukturer",
    }
  - {
      term: "Dynamisk mengde",
      definition: "Funksjonalitet, ikke en bestemt struktur: hold en mengde elementer med nøkler, og støtt <code>Search</code>, <code>Insert</code> og <code>Delete</code>, for ordnede nøkler også <code>Minimum</code>, <code>Maximum</code>, <code>Successor</code> og <code>Predecessor</code>. Finnes ikke svaret, returneres NIL.",
      section: "Datastrukturer",
    }
  - {
      term: "Hashtabell",
      definition: "Oppslagstabell der en hashfunksjon regner indeksen ut fra nøkkelen, for eksempel $h(k) = k \\bmod m$. To nøkler kan få samme indeks, en kollisjon; med kjeding får hver plass en lenket liste som tar imot alle sine nøkler.",
      section: "Datastrukturer",
    }
  - {
      term: "Belastningsfaktor",
      definition: "$\\alpha = n/m$: antall elementer delt på antall plasser i hashtabellen. Med kjeding og jevn fordeling er forventet søketid $\\Theta(1 + \\alpha)$, så tabellen bør vokse i takt med datamengden.",
      section: "Datastrukturer",
    }
  - {
      term: "Perfekt hashing",
      definition: "For en statisk nøkkelmengde kan hashfunksjonen skreddersys slik at ingen nøkler kolliderer. Søk tar da konstant tid selv i verste fall.",
      section: "Datastrukturer",
    }
  - {
      term: "Amortisert analyse",
      definition: "Snitt per operasjon over en hel operasjonsfølge, i verste fall. Aggregert analyse: regn ut totalt arbeid og del på antall operasjoner. Ingen sannsynlighet er involvert, i motsetning til gjennomsnittstilfellet, som er et snitt over instanser.",
      section: "Datastrukturer",
    }
  - {
      term: "Tabelldobling",
      definition: "Når tabellen er full: alloker en dobbelt så stor, kopier alt over og fortsett. Én innsetting kan koste lineær tid, men $n$ innsettinger koster totalt $2n - 1$ operasjoner, altså amortisert konstant per innsetting.",
      section: "Datastrukturer",
    }
  - {
      term: "Søkeproblem",
      definition: "Gitt en instans $x$: finn en løsning $y$ slik at $(x, y) \\in R$. Finnes ingen, feiler søket.",
      section: "Problemer og reduksjoner",
    }
  - {
      term: "Beslutningsproblem",
      definition: "Gitt en instans $x$: avgjør om det finnes en løsning $y$ med $(x, y) \\in R$. Svaret er ja eller nei, og problemet kan ses som mengden av ja-instanser.",
      section: "Problemer og reduksjoner",
    }
  - {
      term: "Optimeringsproblem",
      definition: "Blant de akseptable løsningene til en instans: finn en som er best mulig etter et gitt mål, for eksempel størst, kortest eller billigst.",
      section: "Problemer og reduksjoner",
    }
  - {
      term: "Sertifikat",
      definition: "En påstått løsning som verifiseres: gitt $x$ og sertifikatet $y$, sjekk om $(x, y) \\in R$. Å verifisere er ofte langt billigere enn å finne løsningen selv.",
      section: "Problemer og reduksjoner",
    }
  - {
      term: "Orakel",
      definition: "En hypotetisk subrutine som antas å løse et gitt problem. Reduksjoner beskrives med orakler: det som gjenstår etter omformingen av instansen, overlates til oraklet.",
      section: "Problemer og reduksjoner",
    }
  - {
      term: "Reduksjon",
      definition: "Å løse problem $X$ ved å omforme instansen og bruke et orakel for problem $Y$. Cook-reduksjoner tillater mange orakelkall, Levin-reduksjoner ett kall med oversettelse av løsningen tilbake, og Karp-reduksjoner ett kall der ja/nei-svaret går uendret gjennom. En billig reduksjon fra $X$ til $Y$ viser at $Y$ er minst like vanskelig som $X$.",
      section: "Problemer og reduksjoner",
    }

  - {
      term: "Splitt og hersk",
      definition: "Designmetode: løs grunntilfellet direkte, ellers del instansen i uavhengige delinstanser, løs dem rekursivt og kombiner delsvarene. Arbeidet ligger som regel i enten delingen eller kombinasjonen. Korrektheten vises ved induksjon over problemstørrelsen.",
      section: "Splitt og hersk",
    }
  - {
      term: "Rekurrens",
      definition: "En ligning som definerer en funksjon ved hjelp av seg selv på mindre argumenter, for eksempel $T(n) = 2T(n/2) + n$. Kjøretiden til en rekursiv algoritme har denne formen. En <b>algoritmisk rekurrens</b> har konstant grunntilfelle for små $n$ og terminerer, og det antas når ikke annet er sagt.",
      section: "Splitt og hersk",
    }
  - {
      term: "Iterasjonsmetoden",
      definition: "Løser en rekurrens ved å ekspandere den rekursive forekomsten gjentatte ganger til et mønster viser seg, velge antall ekspansjoner slik at argumentet treffer grunntilfellet, og summere.",
      section: "Splitt og hersk",
    }
  - {
      term: "Rekursjonstre",
      definition: "Iterasjonsmetoden tegnet som et tre: rota er $f(n)$, nivå $i$ har $a^i$ noder av størrelse $n/b^i$, og kjøretiden er summen av nivåkostnadene. Antall løvnoder er $a^{\\log_b n} = n^{\\log_b a}$.",
      section: "Splitt og hersk",
    }
  - {
      term: "Substitusjonsmetoden",
      definition: "Verifiserer en gjettet eller funnet løsning med induksjon: anta at løsningen holder for mindre argumenter, sett inn i rekurrensen og vis at den holder for $n$. Sjekk grunntilfellet. Påstanden må være nøyaktig den samme før og etter, konstanten inkludert; $O(1)$ i hypotesen og $O(1)$ i konklusjonen kan skjule to ulike konstanter.",
      section: "Splitt og hersk",
    }
  - {
      term: "Masterteoremet",
      definition: "Løser $T(n) = aT(n/b) + f(n)$ ved å sammenligne den drivende funksjonen $f(n)$ med vannskillefunksjonen $n^{\\log_b a}$. Er $f$ polynomisk mindre, dominerer løvnodene: $\\Theta(n^{\\log_b a})$. Er $f = \\Theta(n^{\\log_b a} \\lg^k n)$, koster alle nivåene like mye: $\\Theta(n^{\\log_b a} \\lg^{k+1} n)$. Er $f$ polynomisk større og regulær, dominerer rota: $\\Theta(f(n))$.",
      section: "Splitt og hersk",
    }
  - {
      term: "Binærsøk",
      definition: "Søk i en sortert tabell ved å sammenligne med midtelementet og søke rekursivt i den halvdelen verdien må ligge i. $T(n) = T(n/2) + 1$, altså $\\Theta(\\lg n)$. Det rekursive kallet er det siste i prosedyren, så algoritmen skrives like gjerne som en løkke.",
      section: "Splitt og hersk",
    }
  - {
      term: "Merge-Sort",
      definition: "Del på midten, sorter halvdelene rekursivt og flett dem. Flettingen kopierer halvdelene til $L$ og $R$ med en vaktpost $\\infty$ bakerst og flytter det minste forreste elementet til neste ledige plass, i $\\Theta(n)$ tid. $T(n) = 2T(n/2) + n = \\Theta(n \\lg n)$ i alle tilfeller.",
      section: "Splitt og hersk",
    }
  - {
      term: "Quicksort",
      definition: "Partition velger siste element som pivot og ordner resten med små elementer til venstre og store til høyre, i $\\Theta(n)$ tid; pivoten havner på sin endelige plass. Delene sorteres rekursivt. $\\Theta(n \\lg n)$ ved jevn deling og i snitt, $\\Theta(n^2)$ når pivoten står alene, som på sortert input. Randomized-Quicksort bytter et tilfeldig element inn som pivot og har forventet $\\Theta(n \\lg n)$ for enhver input.",
      section: "Splitt og hersk",
    }
  - {
      term: "Forventet kjøretid",
      definition: "Snitt over algoritmens egne tilfeldige valg, for én fast instans. Skiller seg fra gjennomsnittstilfellet, som er et snitt over instanser, og fra amortisert kjøretid, som er et snitt over operasjonene i en følge.",
      section: "Splitt og hersk",
    }

  - {
      term: "Sammenligningsbasert sortering",
      definition: "Sortering som bare får informasjon om elementene gjennom parvise tester $a_i \\le a_j$. Insertion-Sort, Merge-Sort og Quicksort er sammenligningsbaserte; Counting-Sort, Radix-Sort og Bucket-Sort er det ikke.",
      section: "Rangering i lineær tid",
    }
  - {
      term: "Beslutningstre",
      definition: "Modell for en sammenligningsbasert algoritme på $n$ elementer: hver indre node er en sammenligning med to utfall, hver løvnode en ferdig rekkefølge, og én kjøring er en sti fra rota. Sortering krever minst $n!$ løvnoder, så høyden, antall sammenligninger i verste tilfelle, er minst $\\lg n! = \\Omega(n \\lg n)$.",
      section: "Rangering i lineær tid",
    }
  - {
      term: "Sorteringsgrensen",
      definition: "Enhver sammenligningsbasert sorteringsalgoritme bruker $\\Omega(n \\lg n)$ sammenligninger i verste tilfelle. Grensen sier ingenting om beste tilfelle, som kan være $\\Theta(n)$. Den smitter over på et annet problem bare gjennom en reduksjon fra sortering med kjøretid $o(n \\lg n)$.",
      section: "Rangering i lineær tid",
    }
  - {
      term: "Rang",
      definition: "Det $i$-ende minste elementet i en tabell har rang $i$. Rang 1 er minimum, rang $n$ maksimum, og medianen har rang $\\lfloor (n+1)/2 \\rfloor$, den nederste av de to midterste når $n$ er partall.",
      section: "Rangering i lineær tid",
    }
  - {
      term: "Randomized-Select",
      definition: "Finner elementet med rang $i$ som Quicksort med ett rekursivt kall: Randomized-Partition setter pivoten på plass $q$ med rang $k = q - p + 1$ i segmentet. Er $i = k$, er pivoten svaret; er $i < k$, søkes rang $i$ blant de små, ellers rang $i - k$ blant de store. Forventet $\\Theta(n)$ for enhver input, $\\Theta(n^2)$ i verste tilfelle.",
      section: "Rangering i lineær tid",
    }
  - {
      term: "Select",
      definition: "Rangering i garantert $\\Theta(n)$. Pivoten er medianen av medianene til grupper på fem, funnet med et rekursivt kall, og minst $3n/10$ elementer havner på hver side av den. $T(n) \\le T(n/5) + T(7n/10) + \\Theta(n) = \\Theta(n)$. Gir også de $k$ minste elementene i lineær tid: finn rang $k$ og del rundt det.",
      section: "Rangering i lineær tid",
    }
  - {
      term: "Stabil sortering",
      definition: "En sorteringsalgoritme er stabil når like nøkler står i samme innbyrdes rekkefølge i output som i input. Insertion-Sort, Merge-Sort og Counting-Sort er stabile; Quicksort er det ikke. Radix-Sort krever en stabil subrutine.",
      section: "Rangering i lineær tid",
    }
  - {
      term: "Counting-Sort",
      definition: "Sorterer $n$ heltall i området $0 .. k$ uten sammenligninger: tell forekomstene av hver verdi i $C$, gjør $C$ kumulativ slik at $C[v]$ er antall elementer $\\le v$, og gå baklengs gjennom $A$: trekk én fra $C[A[j]]$ og legg $A[j]$ på den plassen i $B$. Baklengs gjør den stabil. $\\Theta(n + k)$.",
      section: "Rangering i lineær tid",
    }
  - {
      term: "Radix-Sort",
      definition: "Sorterer $d$-sifrede tall stabilt på ett siffer om gangen, det minst signifikante først, med Counting-Sort som subrutine. Etter pass $i$ er tallene sortert på de $i$ siste sifrene; stabiliteten er induksjonssteget. $\\Theta(d(n + k))$ når hvert siffer har $k + 1$ verdier.",
      section: "Rangering i lineær tid",
    }
  - {
      term: "Bucket-Sort",
      definition: "Antar input uniformt fordelt i $[0, 1)$. Legg $A[j]$ i bøtte $\\lfloor n \\cdot A[j] \\rfloor$ av $n$, sorter hver bøtte med Insertion-Sort, og sett bøttene etter hverandre. Forventet $\\Theta(n)$ som et snitt over inputer, $\\Theta(n^2)$ i verste tilfelle.",
      section: "Rangering i lineær tid",
    }

  - {
      term: "Rotfast tre",
      definition: "Et fritt tre, en sammenhengende graf uten sykler, med én node valgt som rot. Rota har ingen forelder, hver annen node har én, og nodene rett under en node er barna dens. En løvnode har ingen barn; de andre er indre noder. Dybden er antall kanter opp til rota, og høyden $h$ er den største dybden. Representeres med pekere til barna, eller med én peker til første barn og én til neste søsken.",
      section: "Rotfaste trestrukturer",
    }
  - {
      term: "Komplett binærtre",
      definition: "Et binærtre der alle indre noder har to barn og alle løvnodene har samme dybde. Med $n$ løvnoder har det $n - 1$ indre noder, og med $n$ noder i alt er høyden $\\lfloor \\lg n \\rfloor$.",
      section: "Rotfaste trestrukturer",
    }
  - {
      term: "Binært søketre",
      definition: "Et binærtre med nøkler der alt i venstre deltre til en node er mindre enn eller lik noden og alt i høyre deltre større enn eller lik, for hver node. Søk, innsetting, minimum, maksimum, etterfølger og sletting følger én sti og koster $O(h)$. Høyden er forventet $\\Theta(\\lg n)$ for tilfeldig innsettingsrekkefølge og $n - 1$ i verste tilfelle; balanserte søketrær garanterer $\\Theta(\\lg n)$.",
      section: "Rotfaste trestrukturer",
    }
  - {
      term: "Inorder-Tree-Walk",
      definition: "Besøker venstre deltre, så noden, så høyre deltre, rekursivt fra rota. I et binært søketre kommer nøklene ut i sortert rekkefølge. $\\Theta(n)$. Preorder og postorder behandler noden før eller etter de to rekursive kallene.",
      section: "Rotfaste trestrukturer",
    }
  - {
      term: "Tree-Insert",
      definition: "Søker etter den nye nøkkelen til søket treffer nil, med en peker $y$ ett steg bak $x$, og henger den nye noden på $y$ som venstre eller høyre barn. En ny node blir alltid en løvnode. $O(h)$.",
      section: "Rotfaste trestrukturer",
    }
  - {
      term: "Etterfølger",
      definition: "Noden med den minste nøkkelen som er større enn nøkkelen til $x$, den neste i Inorder-Tree-Walk. Har $x$ et høyre deltre, er etterfølgeren minimum der; ellers er den den nærmeste noden over $x$ som har $x$ i sitt venstre deltre. Tree-Successor følger én sti, $O(h)$. Forgjengeren finnes symmetrisk.",
      section: "Rotfaste trestrukturer",
    }
  - {
      term: "Haug",
      definition: "Et binærtre som er komplett ned til nest nederste nivå, med det nederste fylt fra venstre, lagret i en tabell nummerert nivå for nivå: barna til $i$ er $2i$ og $2i + 1$, forelderen $\\lfloor i/2 \\rfloor$. Haugegenskapen for en maks-haug er $A[\\text{Parent}(i)] \\ge A[i]$ for alle $i$ unntatt rota, så det største elementet står i rota. En min-haug har $\\le$. Høyden er $\\lfloor \\lg n \\rfloor$.",
      section: "Rotfaste trestrukturer",
    }
  - {
      term: "Max-Heapify",
      definition: "Reparerer en maks-haug der bare $A[i]$ kan bryte haugegenskapen: bytt $A[i]$ med det største barnet hvis det er større, og fortsett rekursivt der det mindre elementet havnet. Elementet synker høyst $h$ steg, $O(\\lg n)$.",
      section: "Rotfaste trestrukturer",
    }
  - {
      term: "Build-Max-Heap",
      definition: "Kaller Max-Heapify på de indre nodene fra $\\lfloor n/2 \\rfloor$ ned til 1, nedenfra og opp, så begge deltrærne alltid er hauger når turen kommer til en node. $\\Theta(n)$, for de fleste nodene står langt nede og synker lite. Ikke det samme som $n$ kall til Max-Heap-Insert, som koster $\\Theta(n \\lg n)$ i verste tilfelle.",
      section: "Rotfaste trestrukturer",
    }
  - {
      term: "Prioritetskø",
      definition: "Dynamisk mengde med nøkler som prioriteter, gjerne med duplikater, som støtter Insert, Maximum, Extract-Max og Increase-Key, eller min-variantene. En maks-haug gir Maximum i $\\Theta(1)$ og de tre andre i $O(\\lg n)$: Extract-Max flytter det siste elementet opp i rota og lar det synke, Increase-Key lar elementet stige, og Insert er Increase-Key fra $-\\infty$ på en ny siste plass.",
      section: "Rotfaste trestrukturer",
    }
  - {
      term: "Heapsort",
      definition: "Sortering ved utvelgelse med en maks-haug: bygg haugen av hele $A$, og bytt så $n - 1$ ganger rota med det siste elementet i haugen, minsk haugen og reparer rota med Max-Heapify. Sorterer på plass, $\\Theta(n \\lg n)$ i verste tilfelle og $\\Theta(n)$ i beste, når alle elementene er like.",
      section: "Rotfaste trestrukturer",
    }

