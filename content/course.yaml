# ── Reference formulas → Formelsamling page + inline <FormulaRef id="…"> ──────
# Bare identiteter og resultater du regner med. Definisjonene av O, Omega,
# Theta, o og omega er nettopp definisjoner, ikke formler: de hører hjemme i
# modulens <Statement kind="definition"> og i `glossary` under (AUTHORING.md §9).
# KaTeX i YAML må dobbelt-quotes med doble bakstreker.
# Listen vokser med modulene: her ligger bare det modulene faktisk dekker.
formulas:
  - {
      tex: "O(n^a) + \\Omega(n^b) + \\Theta(n^c) = \\Omega(n^b + n^c)",
      label: "Summer øvre og nedre grenser hver for seg. Står vi igjen med bare en nedre grense, skrives den med $\\Omega$.",
      section: "Asymptotisk notasjon",
      id: sum-grenser,
    }
  - {
      tex: "\\sum_{k=1}^{n-1} k = \\dfrac{n(n-1)}{2} = \\Theta(n^2)",
      label: "Trekanttall, og antall forskyvninger i verste tilfelle for Insertion-Sort",
      section: "Insertion-Sort",
      id: trekanttall,
    }
  - {
      tex: "\\sum_{i=0}^{h-1} 2^i = 2^h - 1",
      label: "Toerpotens-summen: $1 + 2 + 4 + \\cdots + n/2 = n - 1$ når $n = 2^h$. Det totale kopieringsarbeidet i tabelldobling.",
      section: "Tabelldobling",
      id: toerpotenser,
    }

  - {
      tex: "a^{\\log_b n} = n^{\\log_b a}",
      label: "Antall løvnoder i rekursjonstreet til $T(n) = aT(n/b) + f(n)$, skrevet som en potens av $n$. Ta logaritmen på begge sider: $\\log_b n \\cdot \\log a = \\log_b a \\cdot \\log n$.",
      section: "Splitt og hersk",
      id: log-bytte,
    }
  - {
      tex: "T(n) = T(n/2) + 1 = \\lg n + 1 = \\Theta(\\lg n)",
      label: "Binærsøk: ett kall på halve instansen pluss konstant arbeid. Argumentet halveres per ekspansjon, så det trengs $\\lg n$ ekspansjoner.",
      section: "Splitt og hersk",
      id: binaersok-rekurrens,
    }
  - {
      tex: "T(n) = 2T(n/2) + n = n \\lg n + n = \\Theta(n \\lg n)",
      label: "Merge-Sort: rekursjonstreet har $\\lg n + 1$ nivåer som hvert koster $n$.",
      section: "Splitt og hersk",
      id: merge-sort-rekurrens,
    }
  - {
      tex: "T(n) = T(n-1) + n = \\dfrac{n(n+1)}{2} = \\Theta(n^2)",
      label: "Quicksort i verste tilfelle: pivoten står alene på hvert nivå, og nivåkostnadene $n, n-1, \\ldots, 1$ summerer til trekanttallet.",
      section: "Splitt og hersk",
      id: quicksort-verste,
    }
  - {
      tex: "T(n) = aT(n/b) + f(n) \\implies T(n) = \\begin{cases} \\Theta(n^{\\log_b a}) & f(n) = O(n^{\\log_b a - \\epsilon}) \\\\ \\Theta(n^{\\log_b a} \\lg^{k+1} n) & f(n) = \\Theta(n^{\\log_b a} \\lg^{k} n),\\ k \\ge 0 \\\\ \\Theta(f(n)) & f(n) = \\Omega(n^{\\log_b a + \\epsilon}) \\end{cases}",
      label: "Masterteoremet. Sammenlign $f(n)$ med vannskillefunksjonen $n^{\\log_b a}$; avstanden må være en faktor $n^\\epsilon$ i tilfelle 1 og 3, og tilfelle 3 krever i tillegg $a f(n/b) \\le c f(n)$ for en $c < 1$.",
      section: "Splitt og hersk",
      id: masterteoremet,
    }

  - {
      tex: "n! > (n/e)^n \\implies \\lg n! > n \\lg n - n \\lg e = \\Omega(n \\lg n)",
      label: "Sorteringsgrensen. Et beslutningstre med $n!$ løvnoder har høyde minst $\\lg n!$, og Stirlings formel gir $n! > (n/e)^n$. Enhver sammenligningsbasert sortering bruker $\\Omega(n \\lg n)$ sammenligninger i verste tilfelle.",
      section: "Rangering i lineær tid",
      id: sorteringsgrensen,
    }
  - {
      tex: "T(n) = T(n/2) + n = 2n - 1 = \\Theta(n)",
      label: "Randomized-Select når pivoten deler på midten: ett kall på halve instansen pluss lineært arbeid, en geometrisk sum $n + n/2 + \\cdots + 1$. Forventet kjøretid er $\\Theta(n)$ for enhver input; verste tilfelle er $\\Theta(n^2)$.",
      section: "Rangering i lineær tid",
      id: randomized-select-rekurrens,
    }
  - {
      tex: "T(n) \\le T(n/5) + T(7n/10) + \\Theta(n) = \\Theta(n)",
      label: "Select. Medianen av gruppemedianene garanterer at minst $3n/10$ elementer ligger på hver side av pivoten, så det rekursive kallet får høyst $7n/10$. Kallene får til sammen $9n/10 < n$, og rota dominerer.",
      section: "Rangering i lineær tid",
      id: select-rekurrens,
    }
  - {
      tex: "T(n) = \\Theta(n + k)",
      label: "Counting-Sort på $n$ heltall i området $0 .. k$: to løkker over $A$ og én over $C$. Lineær når $k = O(n)$.",
      section: "Rangering i lineær tid",
      id: counting-sort-kjoretid,
    }
  - {
      tex: "T(n) = \\Theta(d(n + k))",
      label: "Radix-Sort: $d$ siffer, hvert med $k + 1$ mulige verdier, sortert stabilt ett siffer om gangen med Counting-Sort.",
      section: "Rangering i lineær tid",
      id: radix-sort-kjoretid,
    }


  - {
      tex: "\\begin{aligned} \\text{Left}(i) &= 2i \\\\ \\text{Right}(i) &= 2i + 1 \\\\ \\text{Parent}(i) &= \\lfloor i/2 \\rfloor \\end{aligned}",
      label: "Haugen som tabell, nummerert nivå for nivå med rota som 1. Med indekser fra 0 blir barna $2i + 1$ og $2i + 2$ og forelderen $\\lfloor (i - 1)/2 \\rfloor$.",
      section: "Rotfaste trestrukturer",
      id: haug-indekser,
    }
  - {
      tex: "2^h \\le n \\le 2^{h+1} - 1",
      label: "Antall elementer i en haug med høyde $h$: nivåene over det nederste er fulle, og det nederste har fra 1 til $2^h$ noder. Altså er $h = \\lfloor \\lg n \\rfloor$.",
      section: "Rotfaste trestrukturer",
      id: haug-hoyde,
    }
  - {
      tex: "\\sum_{k=0}^{\\lfloor \\lg n \\rfloor} \\left\\lceil \\dfrac{n}{2^{k+1}} \\right\\rceil O(k) = O(n)",
      label: "Build-Max-Heap. Høyst $\\lceil n/2^{k+1} \\rceil$ noder har høyde $k$, og hver av dem synker høyst $k$ steg. Summen er $O(n \\sum_{k \\ge 0} k/2^k) = O(2n)$, for $\\sum_{k \\ge 0} k x^k = x/(1-x)^2$. Ikke det samme som $n$ innsettinger, som koster $\\Theta(n \\lg n)$.",
      section: "Rotfaste trestrukturer",
      id: build-max-heap-kjoretid,
    }
  - {
      tex: "\\begin{aligned} T(n) &= \\Theta(n) + (n - 1) \\cdot O(\\lg n) \\\\ &= O(n \\lg n) \\end{aligned}",
      label: "Heapsort: bygg haugen i lineær tid, og ta ut maksimum $n - 1$ ganger med Max-Heapify på $O(\\lg n)$ hver. $\\Theta(n \\lg n)$ i verste tilfelle og $\\Theta(n)$ i beste, når alle elementene er like.",
      section: "Rotfaste trestrukturer",
      id: heapsort-kjoretid,
    }

  - {
      tex: "r_0 = 0 \\allowbreak\\quad r_n = \\max_{1 \\le i \\le n} (p_i + r_{n-i})",
      label: "Stavkapping: prøv alle lengder $i$ på den første biten, og kapp resten optimalt. Med memoisering eller nedenfra og opp er det $\\Theta(n^2)$.",
      section: "Dynamisk programmering",
      id: stavkapping-rekurrens,
    }
  - {
      tex: "T(n) = 1 + \\sum_{j=0}^{n-1} T(j) = 2^n",
      label: "Antall kall Cut-Rod gjør uten lagring, rota medregnet. Trekk $T(n-1)$ fra $T(n)$: da er $T(n) = 2T(n-1)$, og $T(0) = 1$.",
      section: "Dynamisk programmering",
      id: cut-rod-kall,
    }
  - {
      tex: "c[i, j] = \\begin{cases} 0 & i = 0 \\text{ eller } j = 0 \\\\ c[i-1, j-1] + 1 & i, j > 0 \\text{ og } x_i = y_j \\\\ \\max(c[i-1, j],\\, c[i, j-1]) & i, j > 0 \\text{ og } x_i \\ne y_j \\end{cases}",
      label: "Lengden av en LCS av prefiksene $X_i$ og $Y_j$. Tabellen fylles rad for rad i $\\Theta(mn)$.",
      section: "Dynamisk programmering",
      id: lcs-rekurrens,
    }
  - {
      tex: "K[i, j] = \\begin{cases} 0 & i = 0 \\\\ K[i-1, j] & w_i > j \\\\ \\max(K[i-1, j],\\, K[i-1, j - w_i] + v_i) & w_i \\le j \\end{cases}",
      label: "Det binære ryggsekkproblemet med gjenstandene $1, \\ldots, i$ og kapasitet $j$. Tabellen har $(n+1)(W+1)$ celler, så kjøretiden er $\\Theta(nW)$.",
      section: "Dynamisk programmering",
      id: ryggsekk-rekurrens,
    }
  - {
      tex: "\\Theta(nW) = \\Theta(n 2^m) \\allowbreak\\quad m = \\lfloor \\lg W \\rfloor + 1",
      label: "Kjøretiden for ryggsekkproblemet uttrykt ved antall bits $m$ i $W$. Den er polynomisk i tallet $W$, men eksponentiell i inputstørrelsen, altså pseudopolynomisk.",
      section: "Dynamisk programmering",
      id: pseudopolynomisk,
    }

  - {
      tex: "B(T) = \\sum_{c \\in C} c.\\mathit{freq} \\cdot d_T(c)",
      label: "Kostnaden til kodetreet $T$: antall bits i den kodede teksten. Dybden $d_T(c)$ er lengden av kodeordet til $c$. For et huffmantre er det også summen av frekvensene i de indre nodene.",
      section: "Grådighet",
      id: huffman-kostnad,
    }
  - {
      tex: "B(T) = B(T') \\allowbreak + x.\\mathit{freq} + y.\\mathit{freq}",
      label: "Optimal delstruktur for Huffman: $T'$ har det nye tegnet $z$ i stedet for $x$ og $y$. Får $z$ barna $x$ og $y$, blir kodeordene deres én bit lengre.",
      section: "Grådighet",
      id: huffman-delstruktur,
    }

  - {
      tex: "\\sum_{u \\in V} |G.\\mathit{Adj}[u]| = |E|",
      label: "Nabolistene i en rettet graf: kanten $(u, v)$ står bare i lista til $u$. I en urettet graf står den i begge listene, og summen er $2|E|$. Nabolistene tar $\\Theta(V + E)$ plass, og en nabomatrise tar $\\Theta(V^2)$.",
      section: "Traversering av grafer",
      id: nabolister-lengde,
    }
  - {
      tex: "\\Theta(V) + \\sum_{u \\in V} \\Theta(1 + |G.\\mathit{Adj}[u]|) \\allowbreak = \\Theta(V + E)",
      label: "DFS: initialiseringen, og ett kall til DFS-Visit per node, som går gjennom nabolista én gang. BFS bruker $O(V + E)$ med samme argument. Topological-Sort og Strongly-Connected-Components bruker også $\\Theta(V + E)$.",
      section: "Traversering av grafer",
      id: dfs-kjoretid,
    }
  - {
      tex: "u.d < v.d < v.f < u.f",
      label: "Parentesteoremet: $v$ er en ekte etterkommer av $u$ i dybde-først-skogen hvis og bare hvis intervallet til $v$ ligger inni intervallet til $u$. Ellers er intervallene disjunkte, eller $u$ er en etterkommer av $v$.",
      section: "Traversering av grafer",
      id: parentes,
    }
  - {
      tex: "(u, v) \\in E \\;\\Rightarrow\\; v.f < u.f",
      label: "I en DAG går hver kant fra en node med høyere sluttid til en med lavere. Derfor gir synkende sluttid en topologisk sortering.",
      section: "Traversering av grafer",
      id: topologisk-sluttid,
    }
  - {
      tex: "v.d = \\delta(s, v)",
      label: "Etter BFS fra $s$ er $v.d$ det minste antallet kanter på en sti fra $s$ til $v$, og $\\infty$ hvis $v$ ikke kan nås. Stien i bredde-først-treet fra $s$ til $v$ er en korteste vei.",
      section: "Traversering av grafer",
      id: bfs-avstand,
    }

# ── Symbols → Symboler page ──────────────────────────────────────────────────
# Bokstavene modulene bruker, gruppert som modulene. En bokstav med flere
# betydninger får én rad per betydning, med en advarsel i `note`. Algoritmer har
# ingen enheter, så `unit` står tom. Vokser med modulene.
symbols:
  # ── Grunnlag ──
  - { tex: "n", meaning: "Problemstørrelsen, som regel antall elementer", section: "Grunnlag", term: "Problem og instans", id: n, note: "I stavkapping er $n$ lengden på staven, i LCS lengden av $Y$ og i ryggsekkproblemet antall gjenstander." }
  - { tex: "T(n)", meaning: "Kjøretiden som funksjon av $n$", section: "Grunnlag", note: "Står på begge sider i en rekurrens, som $T(n) = 2T(n/2) + n$. For Cut-Rod er $T(n)$ antall kall." }
  - { tex: "O(g(n))", meaning: "Øvre grense: vokser høyst så raskt som $g(n)$", section: "Grunnlag", term: "Asymptotisk notasjon", id: store-o, note: "Som $a \\le b$ for tall. Kan brukes på hvilket som helst tilfelle, også det beste." }
  - { tex: "\\Omega(g(n))", meaning: "Nedre grense: vokser minst så raskt som $g(n)$", section: "Grunnlag", term: "Asymptotisk notasjon", note: "Som $a \\ge b$ for tall." }
  - { tex: "\\Theta(g(n))", meaning: "Stram grense: vokser like raskt som $g(n)$", section: "Grunnlag", term: "Asymptotisk notasjon", id: theta, note: "Som $a = b$ for tall. Både $O$ og $\\Omega$: $c_1\\,g(n) \\le f(n) \\le c_2\\,g(n)$ for $n \\ge n_0$." }
  - { tex: "o(g(n))", meaning: "Øvre grense som ikke er stram: vokser strengt saktere enn $g(n)$", section: "Grunnlag", term: "Asymptotisk notasjon", note: "Som $a < b$ for tall. Ulikheten må holde for enhver $c > 0$, så $f(n)/g(n)$ går mot null." }
  - { tex: "\\omega(g(n))", meaning: "Nedre grense som ikke er stram: vokser strengt raskere enn $g(n)$", section: "Grunnlag", term: "Asymptotisk notasjon", note: "Som $a > b$ for tall. $f(n)/g(n)$ vokser over alle grenser." }
  - { tex: "f(n),\\ g(n)", meaning: "Funksjonene som sammenlignes, som i $f(n) = O(g(n))$", section: "Grunnlag", note: "I masterteoremet er $f(n)$ den drivende funksjonen." }
  - { tex: "c,\\ n_0", meaning: "Konstantene i definisjonene av grensene", section: "Grunnlag", note: "$f(n) = O(g(n))$ når $0 \\le f(n) \\le c\\,g(n)$ for alle $n \\ge n_0$. Ikke tabellen $c[i, j]$ i LCS." }
  - { tex: "\\lg n", meaning: "Toerlogaritmen, $\\log_2 n$", section: "Grunnlag", id: lg, note: "Andre grunntall skrives ut, som $\\log_b n$. $\\lg^k n$ betyr $(\\lg n)^k$." }
  - { tex: "\\lfloor x \\rfloor,\\ \\lceil x \\rceil", meaning: "Tallet $x$ rundet ned og rundet opp til et heltall", section: "Grunnlag", note: "Rekurrenser skriver $n/2$ for $\\lfloor n/2 \\rfloor$. Det endrer ikke den asymptotiske løsningen." }
  - { tex: "\\langle a_1, \\ldots, a_n \\rangle", meaning: "En sekvens, som instansen $\\langle 6, 8, 3, 5 \\rangle$", section: "Grunnlag", note: "I beslutningstreet tester noden $i\\!:\\!j$ om $a_i \\le a_j$." }
  - { tex: "A[i]", meaning: "Element nummer $i$ i tabellen $A$", section: "Grunnlag", note: "Læreboka teller fra 1, Python fra 0. Hauger regnes fra 1 i teksten og fra 0 i koden." }
  - { tex: "A[p .. r]", meaning: "Segmentet $A[p], \\ldots, A[r]$, begge ender med", section: "Grunnlag", id: segment, note: "Læreboka og forelesningene skriver $A[p : r]$ for det samme. I Python er slutten ikke med, så segmentet er <code>A[p : r + 1]</code>." }
  # ── Datastrukturer ──
  - { tex: "a + b(i - s)", meaning: "Adressen til element $i$: startadresse $a$, elementbredde $b$ og startindeks $s$", section: "Datastrukturer", note: "Ikke $a$ og $b$ i masterteoremet." }
  - { tex: "k", meaning: "En nøkkel, i hashtabeller og søketrær", section: "Datastrukturer", note: "Ikke eksponenten $k$ i masterteoremet eller den største verdien $k$ i Counting-Sort." }
  - { tex: "h(k)", meaning: "Hashfunksjonen: plassen nøkkelen $k$ hører til, en av $0, \\ldots, m - 1$", section: "Datastrukturer", term: "Hashtabell", note: "Den enkleste er $h(k) = k \\bmod m$. Ikke høyden $h$ i et tre." }
  - { tex: "m", meaning: "Antall plasser i hashtabellen", section: "Datastrukturer", note: "I LCS er $m$ lengden av $X$, og for ryggsekken antall bits i $W$." }
  - { tex: "\\alpha", meaning: "Belastningsfaktoren, $n/m$", section: "Datastrukturer", term: "Belastningsfaktor", id: alfa, note: "Med kjeding og jevn fordeling tar et søk forventet $\\Theta(1 + \\alpha)$." }
  # ── Problemer og reduksjoner ──
  - { tex: "R \\subseteq I \\times O", meaning: "Et problem, som relasjonen mellom mengden inputs $I$ og mengden outputs $O$", section: "Problemer og reduksjoner", term: "Problem og instans", note: "$O$ er her en mengde, ikke $O$-notasjonen, og $R$ er ikke hjelpetabellen i Merge-Sort." }
  - { tex: "x,\\ y", meaning: "En instans og en løsning: $(x, y) \\in R$ når $y$ er et riktig svar på $x$", section: "Problemer og reduksjoner", term: "Søkeproblem", note: "Et sertifikat er en påstått løsning $y$ som verifiseres." }
  - { tex: "X,\\ Y", meaning: "To problemer i en reduksjon: $X$ løses med et orakel for $Y$", section: "Problemer og reduksjoner", term: "Reduksjon", note: "Er reduksjonen billig, er $Y$ minst like vanskelig som $X$. Ikke sekvensene $X$ og $Y$ i LCS." }
  - { tex: "G,\\ k", meaning: "Grafen og antall noder i klikken i CLIQUE", section: "Problemer og reduksjoner", note: "En klikk er en komplett delgraf." }
  # ── Splitt og hersk ──
  - { tex: "a", meaning: "Antall rekursive kall i $T(n) = aT(n/b) + f(n)$", section: "Splitt og hersk", formula: masterteoremet, note: "Nivå $i$ i rekursjonstreet har $a^i$ noder av størrelse $n/b^i$." }
  - { tex: "b", meaning: "Faktoren instansen krymper med: hvert kall får $n/b$", section: "Splitt og hersk", formula: masterteoremet, note: "Masterteoremet krever konstanter $a \\ge 1$ og $b > 1$, så $T(n - 1)$ er ikke på formen." }
  - { tex: "f(n)", meaning: "Den drivende funksjonen, arbeidet med å dele og kombinere", section: "Splitt og hersk", formula: masterteoremet }
  - { tex: "n^{\\log_b a}", meaning: "Vannskillefunksjonen, antall løvnoder i rekursjonstreet", section: "Splitt og hersk", term: "Masterteoremet", formula: log-bytte, id: vannskille, note: "Kjøretiden avgjøres av om $f(n)$ vokser raskere enn den, like raskt eller saktere." }
  - { tex: "k", meaning: "Eksponenten til $\\lg n$ i tilfelle 2 av masterteoremet, en konstant $k \\ge 0$", section: "Splitt og hersk", formula: masterteoremet, note: "Gir $\\Theta(n^{\\log_b a} \\lg^{k+1} n)$. I simuleringen av rekursjonstreet er $k$ i stedet eksponenten i $f(n) = n^k$." }
  - { tex: "\\epsilon", meaning: "Avstanden i tilfelle 1 og 3: $f(n)$ skiller seg fra $n^{\\log_b a}$ med en faktor $n^\\epsilon$", section: "Splitt og hersk", formula: masterteoremet, id: epsilon, note: "En konstant $\\epsilon > 0$. Tilfelle 3 krever i tillegg $a f(n/b) \\le c f(n)$ for en konstant $c < 1$." }
  - { tex: "x", meaning: "Pivoten, splittelementet", section: "Splitt og hersk", term: "Quicksort", note: "Partition bruker det siste elementet, $x = A[r]$. I Select er $x$ medianen av gruppemedianene." }
  - { tex: "q", meaning: "Plassen segmentet deles ved: midten, eller pivotens endelige plass etter Partition", section: "Splitt og hersk" }
  - { tex: "L,\\ R", meaning: "Venstre og høyre halvdel, kopiert ut før flettingen i Merge-Sort", section: "Splitt og hersk", term: "Merge-Sort", note: "Ikke relasjonen $R$ i et problem." }
  - { tex: "\\infty", meaning: "Vaktposten bakerst i $L$ og $R$, så ingen av halvdelene går tom", section: "Splitt og hersk", note: "$-\\infty$ markerer en delinstans som ikke er løst i memo-tabellen $r$, og er nøkkelen et nytt element får i Max-Heap-Insert før den økes." }
  # ── Rangering i lineær tid ──
  - { tex: "n!", meaning: "Antall rekkefølger av $n$ elementer, og dermed det minste antallet løvnoder i beslutningstreet", section: "Rangering i lineær tid", term: "Beslutningstre", formula: sorteringsgrensen, note: "Høyden, antall sammenligninger i verste tilfelle, er minst $\\lg n! = \\Omega(n \\lg n)$." }
  - { tex: "i", meaning: "Rangen som søkes: det $i$-ende minste elementet", section: "Rangering i lineær tid", term: "Rang", note: "Rang 1 er minimum og rang $n$ maksimum. Medianen har rang $\\lfloor (n+1)/2 \\rfloor$." }
  - { tex: "k", meaning: "Rangen til pivoten i segmentet, $q - p + 1$", section: "Rangering i lineær tid", term: "Randomized-Select", note: "Er $i < k$, søkes rang $i$ blant de små, ellers rang $i - k$ blant de store." }
  - { tex: "k", meaning: "Den største verdien i Counting-Sort: inputen er heltall i $0 .. k$", section: "Rangering i lineær tid", term: "Counting-Sort", formula: counting-sort-kjoretid, note: "I Radix-Sort har hvert siffer $k + 1$ mulige verdier, $k = 9$ for desimale siffer." }
  - { tex: "C[v]", meaning: "Antall elementer lik $v$, og etter den kumulative summen antall $\\le v$", section: "Rangering i lineær tid", term: "Counting-Sort", note: "Den sorterte outputen legges i $B$." }
  - { tex: "d", meaning: "Antall siffer i Radix-Sort", section: "Rangering i lineær tid", term: "Radix-Sort", formula: radix-sort-kjoretid }
  # ── Rotfaste trestrukturer ──
  - { tex: "h", meaning: "Høyden til et tre, den største dybden", section: "Rotfaste trestrukturer", term: "Rotfast tre", formula: haug-hoyde, id: h, note: "Operasjonene i et binært søketre koster $O(h)$, og en haug har $h = \\lfloor \\lg n \\rfloor$. Ikke hashfunksjonen $h(k)$." }
  - { tex: "x,\\ y,\\ z", meaning: "Noder i et binært søketre", section: "Rotfaste trestrukturer", term: "Binært søketre", note: "Tree-Insert setter inn $z$ og lar $y$ gå ett steg bak $x$, så $y$ blir forelderen." }
  - { tex: "\\text{Left}(i)", meaning: "Venstre barn til node $i$ i en haug, $2i$", section: "Rotfaste trestrukturer", term: "Haug", formula: haug-indekser, id: haugindekser, note: "Rota er $A[1]$. Med indekser fra 0, som i Python, er rota $A[0]$ og venstre barn $2i + 1$." }
  - { tex: "\\text{Right}(i)", meaning: "Høyre barn til node $i$ i en haug, $2i + 1$", section: "Rotfaste trestrukturer", formula: haug-indekser, note: "Med indekser fra 0 er høyre barn $2i + 2$." }
  - { tex: "\\text{Parent}(i)", meaning: "Forelderen til node $i$ i en haug, $\\lfloor i/2 \\rfloor$", section: "Rotfaste trestrukturer", formula: haug-indekser, note: "Med indekser fra 0 er forelderen $\\lfloor (i - 1)/2 \\rfloor$. Haugegenskapen er $A[\\text{Parent}(i)] \\ge A[i]$." }
  # ── Dynamisk programmering ──
  - { tex: "u \\to v", meaning: "En kant i delinstansgrafen: svaret for $v$ bygger på svaret for $u$", section: "Dynamisk programmering", term: "Delinstansgraf", note: "Læreboka tegner kantene motsatt vei." }
  - { tex: "p_i", meaning: "Prisen for en bit med lengde $i$", section: "Dynamisk programmering", formula: stavkapping-rekurrens, note: "$p_1, \\ldots, p_8 = 1, 5, 8, 9, 10, 17, 17, 20$ i eksemplene. I Python er <code>p[0]</code> en ubrukt plassholder." }
  - { tex: "r_n", meaning: "Den største totalprisen for en stav med lengde $n$", section: "Dynamisk programmering", formula: stavkapping-rekurrens, id: rn, note: "Lagres i tabellen $r[0 .. n]$. Ikke segmentgrensen $r$ i $A[p .. r]$." }
  - { tex: "s[j]", meaning: "Lengden på den første biten i en optimal kapping av lengde $j$", section: "Dynamisk programmering", note: "Kappingen leses av bakfra: skriv ut $s[n]$, trekk den fra $n$ og gjenta." }
  - { tex: "X,\\ Y", meaning: "Sekvensene i LCS, $\\langle x_1, \\ldots, x_m \\rangle$ og $\\langle y_1, \\ldots, y_n \\rangle$", section: "Dynamisk programmering", term: "Lengste felles delsekvens", note: "Ikke problemene $X$ og $Y$ i en reduksjon." }
  - { tex: "X_i,\\ Y_j", meaning: "Prefiksene $\\langle x_1, \\ldots, x_i \\rangle$ og $\\langle y_1, \\ldots, y_j \\rangle$, delinstansene i LCS", section: "Dynamisk programmering" }
  - { tex: "c[i, j]", meaning: "Lengden av en LCS av $X_i$ og $Y_j$", section: "Dynamisk programmering", formula: lcs-rekurrens, id: cij, note: "Ikke konstanten $c$ i asymptotisk notasjon." }
  - { tex: "b[i, j]", meaning: "Pilen som viser hvilken celle $c[i, j]$ fikk verdien fra", section: "Dynamisk programmering", note: "Print-LCS følger pilene bakfra fra $b[m, n]$." }
  - { tex: "v_i,\\ w_i", meaning: "Verdien og vekten til gjenstand $i$", section: "Dynamisk programmering", term: "Det binære ryggsekkproblemet", formula: ryggsekk-rekurrens }
  - { tex: "W", meaning: "Kapasiteten til ryggsekken", section: "Dynamisk programmering", formula: pseudopolynomisk, id: w, note: "$\\Theta(nW)$ er polynomisk i tallet $W$, men ikke i antall bits." }
  - { tex: "K[i, j]", meaning: "Den største verdien med gjenstandene $1, \\ldots, i$ og kapasitet $j$", section: "Dynamisk programmering", formula: ryggsekk-rekurrens, id: kij, note: "Tabellen har $(n + 1)(W + 1)$ celler." }
  - { tex: "m", meaning: "Antall bits i $W$, $\\lfloor \\lg W \\rfloor + 1$", section: "Dynamisk programmering", term: "Pseudopolynomisk kjøretid", formula: pseudopolynomisk, note: "$\\Theta(nW) = \\Theta(n 2^m)$, som er eksponentielt i $m$." }
  # ── Grådighet ──
  - { tex: "v_i / w_i", meaning: "Kiloprisen til gjenstand $i$, verdi per vektenhet", section: "Grådighet", term: "Det kontinuerlige ryggsekkproblemet", note: "Den grådige algoritmen fyller sekken etter synkende kilopris." }
  - { tex: "[s_i, f_i)", meaning: "Aktivitet $a_i$: starttiden $s_i$ og sluttiden $f_i$, et halvåpent intervall", section: "Grådighet", term: "Aktivitetsutvalg", id: aktivitet, note: "Aktivitetene er sortert etter $f_i$. Den tenkte $a_0$ har $f_0 = 0$. Ikke funksjonen $f(n)$." }
  - { tex: "k", meaning: "Indeksen til den sist valgte aktiviteten", section: "Grådighet", term: "Aktivitetsutvalg", note: "En ny aktivitet $a_m$ tas med når $s_m \\ge f_k$." }
  - { tex: "C", meaning: "Alfabetet: tegnene som skal kodes", section: "Grådighet", term: "Huffman-kode", note: "Ikke tellertabellen $C$ i Counting-Sort." }
  - { tex: "c.\\mathit{freq}", meaning: "Frekvensen til tegnet $c$: hvor mange ganger det står i teksten", section: "Grådighet", formula: huffman-kostnad, note: "En indre node i et huffmantre har summen av frekvensene under seg." }
  - { tex: "d_T(c)", meaning: "Dybden til løvnoden for $c$ i kodetreet $T$, som er lengden av kodeordet", section: "Grådighet", formula: huffman-kostnad }
  - { tex: "B(T)", meaning: "Kostnaden til kodetreet $T$: antall bits i den kodede teksten", section: "Grådighet", formula: huffman-kostnad }
  - { tex: "x,\\ y,\\ z", meaning: "I Huffman: de to trærne med lavest frekvens, og den nye noden som blir forelderen deres", section: "Grådighet", term: "Huffman-kode", formula: huffman-delstruktur, note: "$z$ får frekvensen $x.\\mathit{freq} + y.\\mathit{freq}$. Ikke nodene i et binært søketre." }

  # ── Traversering av grafer ──
  - { tex: "G = (V, E)", meaning: "En graf med nodene $V$ og kantene $E$", section: "Traversering av grafer", id: graf, note: "Inne i asymptotisk notasjon står $V$ og $E$ for antall noder og kanter, som i $O(V + E)$." }
  - { tex: "G.\\mathit{Adj}[u]", meaning: "Nabolista til $u$: ut-naboene", section: "Traversering av grafer", term: "Nabolister", formula: nabolister-lengde, id: adj }
  - { tex: "a_{uv}", meaning: "Elementet i rad $u$, kolonne $v$ i nabomatrisen: 1 når $(u, v)$ er en kant, ellers 0", section: "Traversering av grafer", term: "Nabomatrise" }
  - { tex: "s", meaning: "Startnoden i en traversering", section: "Traversering av grafer", note: "Ikke starttiden $s_i$ til en aktivitet." }
  - { tex: "u.d", meaning: "I DFS: starttiden, da $u$ ble oppdaget og grå", section: "Traversering av grafer", term: "Dybde-først-søk", formula: parentes, id: starttid, note: "I BFS er $u.d$ avstanden fra startnoden." }
  - { tex: "u.f", meaning: "I DFS: sluttiden, da $u$ ble ferdig og svart", section: "Traversering av grafer", term: "Dybde-først-søk", formula: topologisk-sluttid, id: sluttid, note: "Ikke sluttiden $f_i$ til en aktivitet eller funksjonen $f(n)$." }
  - { tex: "u.d", meaning: "I BFS: avstanden fra startnoden $s$ til $u$", section: "Traversering av grafer", term: "Bredde-først-søk", formula: bfs-avstand, id: avstand, note: "$\\infty$ til $u$ er oppdaget." }
  - { tex: "u.\\pi", meaning: "Forgjengeren til $u$: noden $u$ ble oppdaget fra", section: "Traversering av grafer", term: "Traverseringstre", id: forgjenger, note: "nil for startnoden og for røttene i en dybde-først-skog." }
  - { tex: "\\delta(s, v)", meaning: "Avstanden fra $s$ til $v$: det minste antallet kanter på en sti", section: "Traversering av grafer", formula: bfs-avstand, id: delta, note: "$\\infty$ når $v$ ikke kan nås fra $s$." }
  - { tex: "G^{\\mathrm T}", meaning: "Den transponerte grafen: $G$ med alle kantene snudd", section: "Traversering av grafer", term: "Sterke komponenter", id: transponert }

# ── Glossary → Begreper page + inline <Term name="…"> ────────────────────────
# Vokser med modulene, på samme vis som formlene over.
glossary:
  - {
      term: "Problem og instans",
      definition: "Et problem er relasjonen mellom input og output. En instans er én bestemt input. Problemstørrelsen $n$ er plassen en instans trenger, som regel antall elementer.",
      section: "Grunnlag",
    }
  - {
      term: "RAM-modellen",
      definition: "<em>Random-access machine</em>: en idealisert maskin der aritmetikk, sammenligning, hopp og oppslag i én celle koster én tidsenhet hver, og instruksjonene utføres etter hverandre. Heltallene er om lag $c \\lg n$ bits brede.",
      section: "Grunnlag",
    }
  - {
      term: "Asymptotisk notasjon",
      definition: "Et språk for vekst som ser bort fra konstantfaktorer og lavere ordens ledd. Oppfører seg som sammenligning av tall: $O$ er $\\le$, $\\Omega$ er $\\ge$, $\\Theta$ er $=$, $o$ er $<$ og $\\omega$ er $>$. De to siste krever ulikheten for enhver konstant $c > 0$, ikke bare for én.",
      section: "Grunnlag",
    }
  - {
      term: "Beste, verste og gjennomsnittlige tilfelle",
      definition: "Tre funksjoner av $n$: kjøretiden for den billigste instansen av størrelse $n$, for den dyreste, og middelet over alle. Hvilket tilfelle det gjelder er uavhengig av hvilken asymptotisk operator som brukes på det.",
      section: "Grunnlag",
    }
  - {
      term: "Løkkeinvariant",
      definition: "En påstand om tilstanden som holder ved starten av hver iterasjon. Vises med <b>initialisering</b>, <b>vedlikehold</b> og <b>terminering</b>, og er induksjonsbeviset for at løkka er korrekt.",
      section: "Grunnlag",
    }
  - {
      term: "Insertion-Sort",
      definition: "Sorterer ved å holde $A[0 .. i - 1]$ sortert og sette $A[i]$ inn på rett plass i det utsnittet. Bruker $\\Theta(n)$ i beste tilfelle og $\\Theta(n^2)$ i verste, og sorterer på plass.",
      section: "Grunnlag",
    }
  - {
      term: "Stakk",
      definition: "Sist inn, først ut (LIFO). Alt skjer på toppen: <code>Push</code> legger på og <code>Pop</code> tar av, begge i konstant tid. Implementeres med en tabell og en toppindeks.",
      section: "Datastrukturer",
    }
  - {
      term: "Kø",
      definition: "Først inn, først ut (FIFO). <code>Enqueue</code> legger til bakerst og <code>Dequeue</code> tar ut forrest, begge i konstant tid. Implementeres gjerne som ringbuffer: en tabell der indeksene <code>head</code> og <code>tail</code> rykker fremover og går rundt til starten når de passerer enden.",
      section: "Datastrukturer",
    }
  - {
      term: "Lenket liste",
      definition: "Noder som peker på neste node, og i en dobbeltlenket liste også på forrige. Innsetting og sletting koster konstant tid når du står ved noden; søk følger pekerne og koster lineær tid.",
      section: "Datastrukturer",
    }
  - {
      term: "Dynamisk mengde",
      definition: "Funksjonalitet, ikke en bestemt struktur: hold en mengde elementer med nøkler, og støtt <code>Search</code>, <code>Insert</code> og <code>Delete</code>, for ordnede nøkler også <code>Minimum</code>, <code>Maximum</code>, <code>Successor</code> og <code>Predecessor</code>. Finnes ikke svaret, returneres NIL.",
      section: "Datastrukturer",
    }
  - {
      term: "Hashtabell",
      definition: "Oppslagstabell der en hashfunksjon regner indeksen ut fra nøkkelen, for eksempel $h(k) = k \\bmod m$. To nøkler kan få samme indeks, en kollisjon; med kjeding får hver plass en lenket liste som tar imot alle sine nøkler.",
      section: "Datastrukturer",
    }
  - {
      term: "Belastningsfaktor",
      definition: "$\\alpha = n/m$: antall elementer delt på antall plasser i hashtabellen. Med kjeding og jevn fordeling er forventet søketid $\\Theta(1 + \\alpha)$, så tabellen bør vokse i takt med datamengden.",
      section: "Datastrukturer",
    }
  - {
      term: "Perfekt hashing",
      definition: "For en statisk nøkkelmengde kan hashfunksjonen skreddersys slik at ingen nøkler kolliderer. Søk tar da konstant tid selv i verste fall.",
      section: "Datastrukturer",
    }
  - {
      term: "Amortisert analyse",
      definition: "Snitt per operasjon over en hel operasjonsfølge, i verste fall. Aggregert analyse: regn ut totalt arbeid og del på antall operasjoner. Ingen sannsynlighet er involvert, i motsetning til gjennomsnittstilfellet, som er et snitt over instanser.",
      section: "Datastrukturer",
    }
  - {
      term: "Tabelldobling",
      definition: "Når tabellen er full: alloker en dobbelt så stor, kopier alt over og fortsett. Én innsetting kan koste lineær tid, men $n$ innsettinger koster totalt under $3n$ operasjoner, og nøyaktig $2n - 1$ når $n$ er en toerpotens. Det er amortisert konstant per innsetting.",
      section: "Datastrukturer",
    }
  - {
      term: "Søkeproblem",
      definition: "Gitt en instans $x$: finn en løsning $y$ slik at $(x, y) \\in R$. Finnes ingen, feiler søket.",
      section: "Problemer og reduksjoner",
    }
  - {
      term: "Beslutningsproblem",
      definition: "Gitt en instans $x$: avgjør om det finnes en løsning $y$ med $(x, y) \\in R$. Svaret er ja eller nei, og problemet kan ses som mengden av ja-instanser.",
      section: "Problemer og reduksjoner",
    }
  - {
      term: "Optimeringsproblem",
      definition: "Blant de akseptable løsningene til en instans: finn en som er best mulig etter et gitt mål, for eksempel størst, kortest eller billigst.",
      section: "Problemer og reduksjoner",
    }
  - {
      term: "Sertifikat",
      definition: "En påstått løsning som verifiseres: gitt $x$ og sertifikatet $y$, sjekk om $(x, y) \\in R$. Å verifisere er ofte langt billigere enn å finne løsningen selv.",
      section: "Problemer og reduksjoner",
    }
  - {
      term: "Orakel",
      definition: "En hypotetisk subrutine som antas å løse et gitt problem. Reduksjoner beskrives med orakler: det som gjenstår etter omformingen av instansen, overlates til oraklet.",
      section: "Problemer og reduksjoner",
    }
  - {
      term: "Reduksjon",
      definition: "Å løse problem $X$ ved å omforme instansen og bruke et orakel for problem $Y$. Cook-reduksjoner tillater mange orakelkall, Levin-reduksjoner ett kall med oversettelse av løsningen tilbake, og Karp-reduksjoner ett kall der ja/nei-svaret går uendret gjennom. En billig reduksjon fra $X$ til $Y$ viser at $Y$ er minst like vanskelig som $X$.",
      section: "Problemer og reduksjoner",
    }

  - {
      term: "Splitt og hersk",
      definition: "Designmetode: løs grunntilfellet direkte, ellers del instansen i uavhengige delinstanser, løs dem rekursivt og kombiner delsvarene. Arbeidet ligger som regel i enten delingen eller kombinasjonen. Korrektheten vises ved induksjon over problemstørrelsen.",
      section: "Splitt og hersk",
    }
  - {
      term: "Rekurrens",
      definition: "En ligning som definerer en funksjon ved hjelp av seg selv på mindre argumenter, for eksempel $T(n) = 2T(n/2) + n$. Kjøretiden til en rekursiv algoritme har denne formen. En <b>algoritmisk rekurrens</b> har konstant grunntilfelle for små $n$ og terminerer, og det antas når ikke annet er sagt.",
      section: "Splitt og hersk",
    }
  - {
      term: "Iterasjonsmetoden",
      definition: "Løser en rekurrens ved å ekspandere den rekursive forekomsten gjentatte ganger til et mønster viser seg, velge antall ekspansjoner slik at argumentet treffer grunntilfellet, og summere.",
      section: "Splitt og hersk",
    }
  - {
      term: "Rekursjonstre",
      definition: "Iterasjonsmetoden tegnet som et tre: rota er $f(n)$, nivå $i$ har $a^i$ noder av størrelse $n/b^i$, og kjøretiden er summen av nivåkostnadene. Antall løvnoder er $a^{\\log_b n} = n^{\\log_b a}$.",
      section: "Splitt og hersk",
    }
  - {
      term: "Substitusjonsmetoden",
      definition: "Verifiserer en gjettet eller funnet løsning med induksjon: anta at løsningen holder for mindre argumenter, sett inn i rekurrensen og vis at den holder for $n$. Sjekk grunntilfellet. Påstanden må være nøyaktig den samme før og etter, konstanten inkludert; $O(1)$ i hypotesen og $O(1)$ i konklusjonen kan skjule to ulike konstanter.",
      section: "Splitt og hersk",
    }
  - {
      term: "Masterteoremet",
      definition: "Løser $T(n) = aT(n/b) + f(n)$ ved å sammenligne den drivende funksjonen $f(n)$ med vannskillefunksjonen $n^{\\log_b a}$. Er $f$ polynomisk mindre, dominerer løvnodene: $\\Theta(n^{\\log_b a})$. Er $f = \\Theta(n^{\\log_b a} \\lg^k n)$ for en konstant $k \\ge 0$, koster alle nivåene like mye: $\\Theta(n^{\\log_b a} \\lg^{k+1} n)$. Er $f$ polynomisk større og regulær, dominerer rota: $\\Theta(f(n))$.",
      section: "Splitt og hersk",
    }
  - {
      term: "Binærsøk",
      definition: "Søk i en sortert tabell ved å sammenligne med midtelementet og søke rekursivt i den halvdelen verdien må ligge i. $T(n) = T(n/2) + 1$, altså $\\Theta(\\lg n)$. Det rekursive kallet er det siste i prosedyren, så algoritmen skrives like gjerne som en løkke.",
      section: "Splitt og hersk",
    }
  - {
      term: "Merge-Sort",
      definition: "Del på midten, sorter halvdelene rekursivt og flett dem. Flettingen kopierer halvdelene til $L$ og $R$ med en vaktpost $\\infty$ bakerst og flytter det minste forreste elementet til neste ledige plass, i $\\Theta(n)$ tid. $T(n) = 2T(n/2) + n = \\Theta(n \\lg n)$ i alle tilfeller.",
      section: "Splitt og hersk",
    }
  - {
      term: "Quicksort",
      definition: "Partition velger siste element som pivot og ordner resten med små elementer til venstre og store til høyre, i $\\Theta(n)$ tid; pivoten havner på sin endelige plass. Delene sorteres rekursivt. $\\Theta(n \\lg n)$ ved jevn deling og i snitt, $\\Theta(n^2)$ når pivoten står alene, som på sortert input. Randomized-Quicksort bytter et tilfeldig element inn som pivot og har forventet $\\Theta(n \\lg n)$ for enhver input.",
      section: "Splitt og hersk",
    }
  - {
      term: "Forventet kjøretid",
      definition: "Snitt over algoritmens egne tilfeldige valg, for én fast instans. Skiller seg fra gjennomsnittstilfellet, som er et snitt over instanser, og fra amortisert kjøretid, som er et snitt over operasjonene i en følge.",
      section: "Splitt og hersk",
    }

  - {
      term: "Sammenligningsbasert sortering",
      definition: "Sortering som bare får informasjon om elementene gjennom parvise tester $a_i \\le a_j$. Insertion-Sort, Merge-Sort og Quicksort er sammenligningsbaserte; Counting-Sort, Radix-Sort og Bucket-Sort er det ikke.",
      section: "Rangering i lineær tid",
    }
  - {
      term: "Beslutningstre",
      definition: "Modell for en sammenligningsbasert algoritme på $n$ elementer: hver indre node er en sammenligning med to utfall, hver løvnode en ferdig rekkefølge, og én kjøring er en sti fra rota. Sortering krever minst $n!$ løvnoder, så høyden, antall sammenligninger i verste tilfelle, er minst $\\lg n! = \\Omega(n \\lg n)$.",
      section: "Rangering i lineær tid",
    }
  - {
      term: "Sorteringsgrensen",
      definition: "Enhver sammenligningsbasert sorteringsalgoritme bruker $\\Omega(n \\lg n)$ sammenligninger i verste tilfelle. Grensen sier ingenting om beste tilfelle, som kan være $\\Theta(n)$. Den smitter over på et annet problem bare gjennom en reduksjon fra sortering med kjøretid $o(n \\lg n)$.",
      section: "Rangering i lineær tid",
    }
  - {
      term: "Rang",
      definition: "Det $i$-ende minste elementet i en tabell har rang $i$. Rang 1 er minimum, rang $n$ maksimum, og medianen har rang $\\lfloor (n+1)/2 \\rfloor$, den nederste av de to midterste når $n$ er partall.",
      section: "Rangering i lineær tid",
    }
  - {
      term: "Randomized-Select",
      definition: "Finner elementet med rang $i$ som Quicksort med ett rekursivt kall: Randomized-Partition setter pivoten på plass $q$ med rang $k = q - p + 1$ i segmentet. Er $i = k$, er pivoten svaret; er $i < k$, søkes rang $i$ blant de små, ellers rang $i - k$ blant de store. Forventet $\\Theta(n)$ for enhver input, $\\Theta(n^2)$ i verste tilfelle.",
      section: "Rangering i lineær tid",
    }
  - {
      term: "Select",
      definition: "Rangering i garantert $\\Theta(n)$. Pivoten er medianen av medianene til grupper på fem, funnet med et rekursivt kall, og minst $3n/10$ elementer havner på hver side av den. $T(n) \\le T(n/5) + T(7n/10) + \\Theta(n) = \\Theta(n)$. Gir også de $k$ minste elementene i lineær tid: finn rang $k$ og del rundt det.",
      section: "Rangering i lineær tid",
    }
  - {
      term: "Stabil sortering",
      definition: "En sorteringsalgoritme er stabil når like nøkler står i samme innbyrdes rekkefølge i output som i input. Insertion-Sort, Merge-Sort og Counting-Sort er stabile; Quicksort er det ikke. Radix-Sort krever en stabil subrutine.",
      section: "Rangering i lineær tid",
    }
  - {
      term: "Counting-Sort",
      definition: "Sorterer $n$ heltall i området $0 .. k$ uten sammenligninger: tell forekomstene av hver verdi i $C$, gjør $C$ kumulativ slik at $C[v]$ er antall elementer $\\le v$, og gå baklengs gjennom $A$: trekk én fra $C[A[j]]$ og legg $A[j]$ på den plassen i $B$. Baklengs gjør den stabil. $\\Theta(n + k)$.",
      section: "Rangering i lineær tid",
    }
  - {
      term: "Radix-Sort",
      definition: "Sorterer $d$-sifrede tall stabilt på ett siffer om gangen, det minst signifikante først, med Counting-Sort som subrutine. Etter pass $i$ er tallene sortert på de $i$ siste sifrene; stabiliteten er induksjonssteget. $\\Theta(d(n + k))$ når hvert siffer har $k + 1$ verdier.",
      section: "Rangering i lineær tid",
    }
  - {
      term: "Bucket-Sort",
      definition: "Antar input uniformt fordelt i $[0, 1)$. Legg $A[j]$ i bøtte $\\lfloor n \\cdot A[j] \\rfloor$ av $n$, sorter hver bøtte med Insertion-Sort, og sett bøttene etter hverandre. Forventet $\\Theta(n)$ som et snitt over inputer, $\\Theta(n^2)$ i verste tilfelle.",
      section: "Rangering i lineær tid",
    }

  - {
      term: "Rotfast tre",
      definition: "Et fritt tre, en sammenhengende graf uten sykler, med én node valgt som rot. Rota har ingen forelder, hver annen node har én, og nodene rett under en node er barna dens. En løvnode har ingen barn; de andre er indre noder. Dybden er antall kanter opp til rota, og høyden $h$ er den største dybden. Representeres med pekere til barna, eller med én peker til første barn og én til neste søsken.",
      section: "Rotfaste trestrukturer",
    }
  - {
      term: "Komplett binærtre",
      definition: "Et binærtre der alle indre noder har to barn og alle løvnodene har samme dybde. Med $n$ løvnoder har det $n - 1$ indre noder, og med $n$ noder i alt er høyden $\\lfloor \\lg n \\rfloor$.",
      section: "Rotfaste trestrukturer",
    }
  - {
      term: "Binært søketre",
      definition: "Et binærtre med nøkler der alt i venstre deltre til en node er mindre enn eller lik noden og alt i høyre deltre større enn eller lik, for hver node. Søk, innsetting, minimum, maksimum, etterfølger og sletting følger én sti og koster $O(h)$. Høyden er forventet $\\Theta(\\lg n)$ for tilfeldig innsettingsrekkefølge og $n - 1$ i verste tilfelle; balanserte søketrær garanterer $\\Theta(\\lg n)$.",
      section: "Rotfaste trestrukturer",
    }
  - {
      term: "Inorder-Tree-Walk",
      definition: "Besøker venstre deltre, så noden, så høyre deltre, rekursivt fra rota. I et binært søketre kommer nøklene ut i sortert rekkefølge. $\\Theta(n)$. Preorder og postorder behandler noden før eller etter de to rekursive kallene.",
      section: "Rotfaste trestrukturer",
    }
  - {
      term: "Tree-Insert",
      definition: "Søker etter den nye nøkkelen til søket treffer nil, med en peker $y$ ett steg bak $x$, og henger den nye noden på $y$ som venstre eller høyre barn. En ny node blir alltid en løvnode. $O(h)$.",
      section: "Rotfaste trestrukturer",
    }
  - {
      term: "Etterfølger",
      definition: "Noden med den minste nøkkelen som er større enn nøkkelen til $x$, den neste i Inorder-Tree-Walk. Har $x$ et høyre deltre, er etterfølgeren minimum der; ellers er den den nærmeste noden over $x$ som har $x$ i sitt venstre deltre. Tree-Successor følger én sti, $O(h)$. Forgjengeren finnes symmetrisk.",
      section: "Rotfaste trestrukturer",
    }
  - {
      term: "Haug",
      definition: "Et binærtre som er komplett ned til nest nederste nivå, med det nederste fylt fra venstre, lagret i en tabell nummerert nivå for nivå: barna til $i$ er $2i$ og $2i + 1$, forelderen $\\lfloor i/2 \\rfloor$. Haugegenskapen for en maks-haug er $A[\\text{Parent}(i)] \\ge A[i]$ for alle $i$ unntatt rota, så det største elementet står i rota. En min-haug har $\\le$. Høyden er $\\lfloor \\lg n \\rfloor$.",
      section: "Rotfaste trestrukturer",
    }
  - {
      term: "Max-Heapify",
      definition: "Reparerer en maks-haug der bare $A[i]$ kan bryte haugegenskapen: bytt $A[i]$ med det største barnet hvis det er større, og fortsett rekursivt der det mindre elementet havnet. Elementet synker høyst $h$ steg, $O(\\lg n)$.",
      section: "Rotfaste trestrukturer",
    }
  - {
      term: "Build-Max-Heap",
      definition: "Kaller Max-Heapify på de indre nodene fra $\\lfloor n/2 \\rfloor$ ned til 1, nedenfra og opp, så begge deltrærne alltid er hauger når turen kommer til en node. $\\Theta(n)$, for de fleste nodene står langt nede og synker lite. Ikke det samme som $n$ kall til Max-Heap-Insert, som koster $\\Theta(n \\lg n)$ i verste tilfelle.",
      section: "Rotfaste trestrukturer",
    }
  - {
      term: "Prioritetskø",
      definition: "Dynamisk mengde med nøkler som prioriteter, gjerne med duplikater, som støtter Insert, Maximum, Extract-Max og Increase-Key, eller min-variantene. En maks-haug gir Maximum i $\\Theta(1)$ og de tre andre i $O(\\lg n)$: Extract-Max flytter det siste elementet opp i rota og lar det synke, Increase-Key lar elementet stige, og Insert er Increase-Key fra $-\\infty$ på en ny siste plass.",
      section: "Rotfaste trestrukturer",
    }
  - {
      term: "Heapsort",
      definition: "Sortering ved utvelgelse med en maks-haug: bygg haugen av hele $A$, og bytt så $n - 1$ ganger rota med det siste elementet i haugen, minsk haugen og reparer rota med Max-Heapify. Sorterer på plass, $\\Theta(n \\lg n)$ i verste tilfelle og $\\Theta(n)$ i beste, når alle elementene er like.",
      section: "Rotfaste trestrukturer",
    }

  - {
      term: "Dynamisk programmering",
      definition: "Designmetode: rekursiv dekomponering der hvert delsvar lagres første gang det regnes ut og slås opp senere. Gir riktig svar når problemet har optimal delstruktur, og lønner seg når delinstansene overlapper. Løses med memoisering ovenfra og ned, eller iterativt nedenfra og opp i topologisk rekkefølge i delinstansgrafen.",
      section: "Dynamisk programmering",
    }
  - {
      term: "Delinstansgraf",
      definition: "Én node per forskjellig delinstans, og en kant fra $u$ til $v$ når svaret for $v$ bygger på svaret for $u$. Må være asyklisk, og hver kjede av avhengigheter må ende i et grunntilfelle. Kalltreet til en rekursiv løsning har én node per sti i grafen som ender i instansen. Kjøretiden til dynamisk programmering er som regel lineær i antall noder og kanter.",
      section: "Dynamisk programmering",
    }
  - {
      term: "Overlappende delinstanser",
      definition: "Flere instanser bygger på den samme delinstansen, direkte eller indirekte. Skjer det på mange nivåer, blir en rekursiv løsning uten lagring eksponentiell. I splitt og hersk overlapper delinstansene ikke, så der gir lagring ingenting.",
      section: "Dynamisk programmering",
    }
  - {
      term: "Optimal delstruktur",
      definition: "En optimal løsning består av optimale løsninger på delinstansene. Vises som regel ved å bytte ut en del: var den ikke optimal, kunne den byttes ut og gi en bedre løsning. Korteste vei har egenskapen. Lengste enkle vei har den ikke, for to lengste delveier kan bruke de samme nodene.",
      section: "Dynamisk programmering",
    }
  - {
      term: "Memoisering",
      definition: "Rekursjon med hukommelse: første kall med et argument regner ut svaret og lagrer det, og senere kall med samme argument slår det opp. Løsningen ovenfra og ned (top-down) i dynamisk programmering. Løser bare delinstansene som faktisk trengs.",
      section: "Dynamisk programmering",
    }
  - {
      term: "Lengste felles delsekvens",
      definition: "Forkortet LCS. En lengste sekvens som er en delsekvens av både $X$ og $Y$, der en delsekvens er det som står igjen når null eller flere elementer strykes. LCS-Length fyller $c[i, j]$ for prefiksene $X_i$ og $Y_j$ rad for rad og lagrer en pil i $b$, og Print-LCS følger pilene bakfra. $\\Theta(mn)$.",
      section: "Dynamisk programmering",
    }
  - {
      term: "Det binære ryggsekkproblemet",
      definition: "Gjenstander med verdi $v_i$ og vekt $w_i$, og en kapasitet $W$: velg gjenstander med størst mulig totalverdi og totalvekt høyst $W$, der hver gjenstand er med eller ikke med. $K[i, j]$ er det beste med gjenstandene $1, \\ldots, i$ og kapasitet $j$, og er den største av verdien uten gjenstand $i$ og verdien med den. $\\Theta(nW)$, som er pseudopolynomisk.",
      section: "Dynamisk programmering",
    }
  - {
      term: "Pseudopolynomisk kjøretid",
      definition: "Polynomisk som funksjon av et tall fra inputen, men ikke av inputstørrelsen i bits. Ryggsekkløsningen bruker $\\Theta(nW)$, men $W$ tar bare $m = \\lfloor \\lg W \\rfloor + 1$ bits, så kjøretiden er $\\Theta(n 2^m)$.",
      section: "Dynamisk programmering",
    }

  - {
      term: "Grådighet",
      definition: "Designmetode: gjør det valget som ser best ut her og nå, løs den ene delinstansen som er igjen, og sett valget og delløsningen sammen. Valget tas før noen delinstans er løst. Algoritmen er riktig når problemet har grådighetsegenskapen og optimal delstruktur.",
      section: "Grådighet",
    }
  - {
      term: "Grådighetsegenskapen",
      definition: "Det finnes en optimal løsning som tar det første grådige valget. Egenskapen sier bare at det første valget er trygt. At alle de grådige valgene er trygge, følger først sammen med optimal delstruktur, ved induksjon.",
      section: "Grådighet",
    }
  - {
      term: "Utvekslingsargument",
      definition: "Bevis for grådighetsegenskapen: ta en vilkårlig optimal løsning, bytt ut ett av valgene med det grådige, og vis at løsningen fortsatt er lovlig og ikke blir dårligere. Da finnes en optimal løsning med det grådige valget.",
      section: "Grådighet",
    }
  - {
      term: "Det kontinuerlige ryggsekkproblemet",
      definition: "Som det binære ryggsekkproblemet, men vi kan ta med en andel mellom 0 og 1 av hver gjenstand og får samme andel av verdien. Løses grådig: fyll sekken etter synkende kilopris $v_i / w_i$, så bare den siste gjenstanden blir delt. $O(n \\lg n)$ med sorteringen.",
      section: "Grådighet",
    }
  - {
      term: "Aktivitetsutvalg",
      definition: "Velg flest mulig aktiviteter $[s_i, f_i)$ der ingen to overlapper. Det grådige valget er aktiviteten som slutter først, og delinstansen som er igjen, er aktivitetene som starter etter at den slutter. Greedy-Activity-Selector bruker $\\Theta(n)$ når aktivitetene er sortert etter sluttid.",
      section: "Grådighet",
    }
  - {
      term: "Prefiksfri kode",
      definition: "Binær kode der ingen kodeord er et prefiks av et annet, så en kodet tekst kan dekodes ett kodeord om gangen fra starten. Tegnes som et kodetre med tegnene i løvnodene: kodeordet er stien fra rota, med 0 for venstre og 1 for høyre barn, og lengden er dybden.",
      section: "Grådighet",
    }
  - {
      term: "Huffman-kode",
      definition: "En optimal prefiksfri kode, laget av Huffmans algoritme. Hvert tegn starter som et tre i en min-prioritetskø på frekvens, og $n - 1$ ganger slås de to trærne med lavest frekvens sammen under en ny node med summen av frekvensene. $O(n \\lg n)$ med en binær haug.",
      section: "Grådighet",
    }

  - {
      term: "Nabolister",
      definition: "Grafrepresentasjon med én liste per node: $G.\\mathit{Adj}[u]$ inneholder ut-naboene til $u$. Tar $\\Theta(V + E)$ plass. Å gå gjennom naboene til $u$ tar tid proporsjonal med antallet, men å sjekke om $(u, v)$ er en kant krever et søk i lista. Standardvalget for traversering.",
      section: "Traversering av grafer",
    }
  - {
      term: "Nabomatrise",
      definition: "Grafrepresentasjon som en $|V| \\times |V|$-tabell der $a_{uv} = 1$ når $(u, v)$ er en kant. Tar $\\Theta(V^2)$ plass uansett antall kanter, og svarer på om $(u, v)$ er en kant i konstant tid. Symmetrisk for en urettet graf.",
      section: "Traversering av grafer",
    }
  - {
      term: "Traverseringstre",
      definition: "Treet som forgjengerkantene $(v.\\pi, v)$ danner etter en traversering, med startnoden som rot. BFS gir et bredde-først-tre der stien fra rota er en korteste vei. DFS gir en dybde-først-skog med ett tre per kall fra hovedløkka.",
      section: "Traversering av grafer",
    }
  - {
      term: "Dybde-først-søk",
      definition: "Forkortet DFS. Traversering som går videre fra den nyeste noden den har oppdaget: DFS-Visit kaller seg selv på hver hvite nabo med en gang. DFS starter fra hver hvite node etter tur og gir hver node en starttid $u.d$ og en sluttid $u.f$. $\\Theta(V + E)$.",
      section: "Traversering av grafer",
    }
  - {
      term: "Parentesteoremet",
      definition: "I en dybde-først-skog er intervallene $[u.d, u.f]$ og $[v.d, v.f]$ enten disjunkte, eller så ligger det ene inni det andre, og da er den indre noden en etterkommer av den ytre. Skrives «(u» ved $u.d$ og «u)» ved $u.f$, blir parentesene riktig nøstet.",
      section: "Traversering av grafer",
    }
  - {
      term: "Hvit-sti-teoremet",
      definition: "$v$ er en etterkommer av $u$ i en dybde-først-skog hvis og bare hvis det, da $u$ ble oppdaget, fantes en sti fra $u$ til $v$ med bare hvite noder.",
      section: "Traversering av grafer",
    }
  - {
      term: "Kantklassifisering",
      definition: "DFS deler kantene i tre-kanter (i dybde-først-skogen), bakoverkanter (til en forfader), foroverkanter (til en etterkommer, utenfor treet) og krysskanter (alle andre). Kanten $(u, v)$ er en tre-kant hvis $v$ er hvit når den undersøkes, en bakoverkant hvis $v$ er grå, og en forover- eller krysskant hvis $v$ er svart. En rettet graf har en sykel hvis og bare hvis DFS finner en bakoverkant.",
      section: "Traversering av grafer",
    }
  - {
      term: "DAG",
      definition: "Rettet asyklisk graf: en rettet graf uten sykler. Har en topologisk sortering, og DFS finner ingen bakoverkanter i den.",
      section: "Traversering av grafer",
    }
  - {
      term: "Topologisk sortering",
      definition: "En rekkefølge av nodene i en DAG der $u$ kommer før $v$ for hver kant $(u, v)$. Topological-Sort kjører DFS og setter hver node først i en lenket liste når den blir ferdig, så lista blir sortert etter synkende sluttid. $\\Theta(V + E)$.",
      section: "Traversering av grafer",
    }
  - {
      term: "Sterke komponenter",
      definition: "De største mengdene av noder i en rettet graf der hver node kan nå hver annen langs rettede stier. Kollapses hver komponent til én node, blir grafen en DAG. Strongly-Connected-Components kjører DFS på $G$, og så DFS på $G^{\\mathrm T}$ med startnodene etter synkende sluttid: hvert tre er én komponent. $\\Theta(V + E)$.",
      section: "Traversering av grafer",
    }
  - {
      term: "Bredde-først-søk",
      definition: "Forkortet BFS. Traversering med en FIFO-kø fra en startnode $s$: nodene besøkes lag for lag, i stigende avstand. Gir $v.d = \\delta(s, v)$, korteste vei målt i antall kanter, og et bredde-først-tre av forgjengerkanter. $O(V + E)$.",
      section: "Traversering av grafer",
    }

