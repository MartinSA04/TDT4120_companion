<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" width="560" height="300" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
  <!-- Transparent background: the Figure frame supplies the ground, and these
       mid-tone colours hold contrast on both the light and the dark theme.
       The table T on the left, chains growing rightwards, the hash arithmetic
       listed on the right. Red digits mark the search path for key 19. -->
  <defs>
    <marker id="hk-graa" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#8d98a6"/>
    </marker>
  </defs>

  <text x="60" y="30" text-anchor="start" font-size="15" fill="#7c8795">h(k) = k mod 7</text>
  <text x="60" y="52" text-anchor="start" font-size="13" fill="#7c8795">sett inn 19, 36, 5, 21, 12</text>

  <!-- The table T, slots 0-6 -->
  <rect x="60" y="72" width="44" height="30" fill="none" stroke="#8d98a6" stroke-opacity="0.55"/>
  <rect x="60" y="102" width="44" height="30" fill="none" stroke="#8d98a6" stroke-opacity="0.55"/>
  <rect x="60" y="132" width="44" height="30" fill="none" stroke="#8d98a6" stroke-opacity="0.55"/>
  <rect x="60" y="162" width="44" height="30" fill="none" stroke="#8d98a6" stroke-opacity="0.55"/>
  <rect x="60" y="192" width="44" height="30" fill="none" stroke="#8d98a6" stroke-opacity="0.55"/>
  <rect x="60" y="222" width="44" height="30" fill="none" stroke="#8d98a6" stroke-opacity="0.55"/>
  <rect x="60" y="252" width="44" height="30" fill="none" stroke="#8d98a6" stroke-opacity="0.55"/>
  <text x="52" y="91" text-anchor="end" font-size="13" fill="#7c8795">0</text>
  <text x="52" y="121" text-anchor="end" font-size="13" fill="#7c8795">1</text>
  <text x="52" y="151" text-anchor="end" font-size="13" fill="#7c8795">2</text>
  <text x="52" y="181" text-anchor="end" font-size="13" fill="#7c8795">3</text>
  <text x="52" y="211" text-anchor="end" font-size="13" fill="#7c8795">4</text>
  <text x="52" y="241" text-anchor="end" font-size="13" fill="#7c8795">5</text>
  <text x="52" y="271" text-anchor="end" font-size="13" fill="#7c8795">6</text>

  <!-- Empty slots -->
  <line x1="66" y1="156" x2="98" y2="138" stroke="#8d98a6" stroke-opacity="0.45"/>
  <line x1="66" y1="186" x2="98" y2="168" stroke="#8d98a6" stroke-opacity="0.45"/>
  <line x1="66" y1="216" x2="98" y2="198" stroke="#8d98a6" stroke-opacity="0.45"/>
  <line x1="66" y1="276" x2="98" y2="258" stroke="#8d98a6" stroke-opacity="0.45"/>

  <!-- Slot 0: 21 -->
  <line x1="104" y1="87" x2="132" y2="87" stroke="#8d98a6" stroke-width="1.4" marker-end="url(#hk-graa)"/>
  <rect x="140" y="74" width="48" height="26" rx="4" fill="#2f8f86" fill-opacity="0.12" stroke="#8d98a6"/>
  <text x="164" y="92" text-anchor="middle" font-size="14" fill="#2f8f86">21</text>
  <line x1="188" y1="87" x2="210" y2="87" stroke="#8d98a6" stroke-width="1.4" marker-end="url(#hk-graa)"/>
  <text x="218" y="92" text-anchor="start" font-size="14" fill="#8d98a6">&#8709;</text>

  <!-- Slot 1: 36 -->
  <line x1="104" y1="117" x2="132" y2="117" stroke="#8d98a6" stroke-width="1.4" marker-end="url(#hk-graa)"/>
  <rect x="140" y="104" width="48" height="26" rx="4" fill="#2f8f86" fill-opacity="0.12" stroke="#8d98a6"/>
  <text x="164" y="122" text-anchor="middle" font-size="14" fill="#2f8f86">36</text>
  <line x1="188" y1="117" x2="210" y2="117" stroke="#8d98a6" stroke-width="1.4" marker-end="url(#hk-graa)"/>
  <text x="218" y="122" text-anchor="start" font-size="14" fill="#8d98a6">&#8709;</text>

  <!-- Slot 5: 12 -> 5 -> 19, newest first -->
  <line x1="104" y1="237" x2="132" y2="237" stroke="#8d98a6" stroke-width="1.4" marker-end="url(#hk-graa)"/>
  <rect x="140" y="224" width="48" height="26" rx="4" fill="#2f8f86" fill-opacity="0.12" stroke="#8d98a6"/>
  <text x="164" y="242" text-anchor="middle" font-size="14" fill="#2f8f86">12</text>
  <line x1="188" y1="237" x2="216" y2="237" stroke="#8d98a6" stroke-width="1.4" marker-end="url(#hk-graa)"/>
  <rect x="224" y="224" width="48" height="26" rx="4" fill="#2f8f86" fill-opacity="0.12" stroke="#8d98a6"/>
  <text x="248" y="242" text-anchor="middle" font-size="14" fill="#2f8f86">5</text>
  <line x1="272" y1="237" x2="300" y2="237" stroke="#8d98a6" stroke-width="1.4" marker-end="url(#hk-graa)"/>
  <rect x="308" y="224" width="48" height="26" rx="4" fill="#2f8f86" fill-opacity="0.12" stroke="#8d98a6"/>
  <text x="332" y="242" text-anchor="middle" font-size="14" fill="#2f8f86">19</text>
  <line x1="356" y1="237" x2="378" y2="237" stroke="#8d98a6" stroke-width="1.4" marker-end="url(#hk-graa)"/>
  <text x="386" y="242" text-anchor="start" font-size="14" fill="#8d98a6">&#8709;</text>

  <!-- Search order for key 19 -->
  <text x="164" y="218" text-anchor="middle" font-size="12" fill="#c14a3e">1</text>
  <text x="248" y="218" text-anchor="middle" font-size="12" fill="#c14a3e">2</text>
  <text x="332" y="218" text-anchor="middle" font-size="12" fill="#c14a3e">3</text>

  <!-- The hash arithmetic -->
  <text x="408" y="100" text-anchor="start" font-size="13" fill="#7c8795">19 mod 7 = 5</text>
  <text x="408" y="124" text-anchor="start" font-size="13" fill="#7c8795">36 mod 7 = 1</text>
  <text x="408" y="148" text-anchor="start" font-size="13" fill="#7c8795">5 mod 7 = 5</text>
  <text x="408" y="172" text-anchor="start" font-size="13" fill="#7c8795">21 mod 7 = 0</text>
  <text x="408" y="196" text-anchor="start" font-size="13" fill="#7c8795">12 mod 7 = 5</text>
</svg>
