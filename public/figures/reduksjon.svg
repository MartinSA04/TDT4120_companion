<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 410" width="560" height="410" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
  <!-- Transparent background: the Figure frame supplies the ground, and these
       mid-tone colours hold contrast on both the light and the dark theme.
       Red boxes are our own polynomial work, the dashed teal box is the
       assumed subroutine, as in the decomposition figure. -->
  <defs>
    <marker id="rd-graa" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#8d98a6"/>
    </marker>
  </defs>

  <text x="250" y="30" text-anchor="middle" font-size="14" fill="#7c8795">instans av X</text>
  <line x1="250" y1="40" x2="250" y2="58" stroke="#8d98a6" stroke-width="1.4" marker-end="url(#rd-graa)"/>

  <rect x="120" y="64" width="260" height="298" rx="8" fill="#9aa0a6" fill-opacity="0.05" stroke="#8d98a6"/>
  <text x="250" y="88" text-anchor="middle" font-size="13" fill="#7c8795">algoritme for X</text>

  <rect x="180" y="102" width="140" height="38" rx="6" fill="#c14a3e" fill-opacity="0.08" stroke="#c14a3e"/>
  <text x="250" y="126" text-anchor="middle" font-size="14" fill="#c14a3e">omform</text>
  <text x="394" y="126" text-anchor="start" font-size="12" fill="#c14a3e" opacity="0.85">polynomisk tid</text>

  <line x1="250" y1="140" x2="250" y2="158" stroke="#8d98a6" stroke-width="1.4" marker-end="url(#rd-graa)"/>
  <text x="250" y="177" text-anchor="middle" font-size="13" fill="#7c8795">instans av Y</text>
  <line x1="250" y1="186" x2="250" y2="204" stroke="#8d98a6" stroke-width="1.4" marker-end="url(#rd-graa)"/>

  <rect x="180" y="210" width="140" height="38" rx="6" fill="#2f8f86" fill-opacity="0.08" stroke="#2f8f86" stroke-dasharray="6 5"/>
  <text x="250" y="234" text-anchor="middle" font-size="14" fill="#2f8f86">orakel for Y</text>
  <text x="394" y="234" text-anchor="start" font-size="12" fill="#2f8f86" opacity="0.9">antatt subrutine</text>

  <line x1="250" y1="248" x2="250" y2="266" stroke="#8d98a6" stroke-width="1.4" marker-end="url(#rd-graa)"/>
  <text x="250" y="285" text-anchor="middle" font-size="13" fill="#7c8795">løsning for Y</text>
  <line x1="250" y1="294" x2="250" y2="312" stroke="#8d98a6" stroke-width="1.4" marker-end="url(#rd-graa)"/>

  <rect x="180" y="318" width="140" height="38" rx="6" fill="#c14a3e" fill-opacity="0.08" stroke="#c14a3e"/>
  <text x="250" y="342" text-anchor="middle" font-size="14" fill="#c14a3e">oversett</text>
  <text x="394" y="342" text-anchor="start" font-size="12" fill="#c14a3e" opacity="0.85">polynomisk tid</text>

  <line x1="250" y1="356" x2="250" y2="380" stroke="#8d98a6" stroke-width="1.4" marker-end="url(#rd-graa)"/>
  <text x="250" y="399" text-anchor="middle" font-size="14" fill="#7c8795">løsning for X</text>
</svg>
