<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" width="560" height="300" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
  <!-- Transparent background: the Figure frame supplies the ground, and these
       mid-tone colours hold contrast on both the light and the dark theme.
       Red = pointers assigned by the operation, dashed grey = overwritten or
       bypassed values, faded = untouched. Upper lane is next, lower is prev. -->
  <defs>
    <marker id="ll-roed" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#c14a3e"/>
    </marker>
    <marker id="ll-graa" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#8d98a6"/>
    </marker>
    <marker id="ll-graa-svak" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#8d98a6" fill-opacity="0.45"/>
    </marker>
  </defs>

  <!-- Row 1: insertion of x after a -->
  <text x="70" y="32" text-anchor="start" font-size="13" fill="#7c8795">Innsetting av x etter a</text>
  <text x="490" y="32" text-anchor="end" font-size="13" fill="#c14a3e">fire pekertilordninger</text>

  <rect x="70" y="60" width="64" height="40" rx="6" fill="#9aa0a6" fill-opacity="0.08" stroke="#8d98a6"/>
  <text x="102" y="85" text-anchor="middle" font-size="15" fill="#7c8795">a</text>
  <rect x="248" y="60" width="64" height="40" rx="6" fill="#2f8f86" fill-opacity="0.1" stroke="#2f8f86"/>
  <text x="280" y="85" text-anchor="middle" font-size="15" fill="#2f8f86">x</text>
  <rect x="426" y="60" width="64" height="40" rx="6" fill="#9aa0a6" fill-opacity="0.08" stroke="#8d98a6"/>
  <text x="458" y="85" text-anchor="middle" font-size="15" fill="#7c8795">b</text>

  <!-- old a <-> b, overwritten -->
  <path d="M 134,64 Q 280,18 422,62" fill="none" stroke="#8d98a6" stroke-width="1.4" stroke-dasharray="5 5" marker-end="url(#ll-graa)"/>
  <path d="M 426,96 Q 280,142 140,98" fill="none" stroke="#8d98a6" stroke-width="1.4" stroke-dasharray="5 5" marker-end="url(#ll-graa)"/>
  <!-- the four new pointers -->
  <line x1="134" y1="72" x2="242" y2="72" stroke="#c14a3e" stroke-width="1.6" marker-end="url(#ll-roed)"/>
  <line x1="248" y1="88" x2="140" y2="88" stroke="#c14a3e" stroke-width="1.6" marker-end="url(#ll-roed)"/>
  <line x1="312" y1="72" x2="420" y2="72" stroke="#c14a3e" stroke-width="1.6" marker-end="url(#ll-roed)"/>
  <line x1="426" y1="88" x2="318" y2="88" stroke="#c14a3e" stroke-width="1.6" marker-end="url(#ll-roed)"/>

  <!-- Row 2: deletion of b -->
  <text x="70" y="172" text-anchor="start" font-size="13" fill="#7c8795">Sletting av b</text>
  <text x="490" y="172" text-anchor="end" font-size="13" fill="#c14a3e">to pekertilordninger</text>

  <rect x="70" y="200" width="64" height="40" rx="6" fill="#9aa0a6" fill-opacity="0.08" stroke="#8d98a6"/>
  <text x="102" y="225" text-anchor="middle" font-size="15" fill="#7c8795">a</text>
  <g opacity="0.45">
    <rect x="248" y="200" width="64" height="40" rx="6" fill="#9aa0a6" fill-opacity="0.08" stroke="#8d98a6"/>
    <text x="280" y="225" text-anchor="middle" font-size="15" fill="#7c8795">b</text>
  </g>
  <rect x="426" y="200" width="64" height="40" rx="6" fill="#9aa0a6" fill-opacity="0.08" stroke="#8d98a6"/>
  <text x="458" y="225" text-anchor="middle" font-size="15" fill="#7c8795">c</text>

  <!-- old pointers into b, overwritten -->
  <line x1="134" y1="212" x2="242" y2="212" stroke="#8d98a6" stroke-width="1.4" stroke-dasharray="5 5" marker-end="url(#ll-graa)"/>
  <line x1="426" y1="228" x2="318" y2="228" stroke="#8d98a6" stroke-width="1.4" stroke-dasharray="5 5" marker-end="url(#ll-graa)"/>
  <!-- b's own pointers, untouched -->
  <line x1="312" y1="212" x2="420" y2="212" stroke="#8d98a6" stroke-width="1.4" opacity="0.45" marker-end="url(#ll-graa-svak)"/>
  <line x1="248" y1="228" x2="140" y2="228" stroke="#8d98a6" stroke-width="1.4" opacity="0.45" marker-end="url(#ll-graa-svak)"/>
  <!-- the two new pointers, past b -->
  <path d="M 134,206 Q 280,158 422,208" fill="none" stroke="#c14a3e" stroke-width="1.6" marker-end="url(#ll-roed)"/>
  <path d="M 426,234 Q 280,282 140,236" fill="none" stroke="#c14a3e" stroke-width="1.6" marker-end="url(#ll-roed)"/>
</svg>
