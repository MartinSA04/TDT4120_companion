<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 290" width="560" height="290" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
  <!-- Transparent background: the Figure frame supplies the ground, and these
       mid-tone colours hold contrast on both the light and the dark theme.
       The same seven keys inserted in two orders: sorted, which makes every
       new key the right child of the previous one (a chain of height 6), and
       an order that fills the tree level by level (height 2). -->

  <text x="30" y="26" text-anchor="start" font-size="13" fill="#7c8795">sett inn 1, 2, 3, 4, 5, 6, 7</text>
  <text x="300" y="26" text-anchor="start" font-size="13" fill="#7c8795">sett inn 4, 2, 6, 1, 3, 5, 7</text>

  <!-- Left: the chain -->
  <line x1="67.3" y1="69.0" x2="78.7" y2="80.0" stroke="#8d98a6" stroke-width="1.4"/>
  <line x1="97.3" y1="98.0" x2="108.7" y2="109.0" stroke="#8d98a6" stroke-width="1.4"/>
  <line x1="127.3" y1="127.0" x2="138.7" y2="138.0" stroke="#8d98a6" stroke-width="1.4"/>
  <line x1="157.3" y1="156.0" x2="168.7" y2="167.0" stroke="#8d98a6" stroke-width="1.4"/>
  <line x1="187.3" y1="185.0" x2="198.7" y2="196.0" stroke="#8d98a6" stroke-width="1.4"/>
  <line x1="217.3" y1="214.0" x2="228.7" y2="225.0" stroke="#8d98a6" stroke-width="1.4"/>

  <circle cx="58" cy="60" r="13" fill="#2f8f86" fill-opacity="0.12" stroke="#8d98a6"/>
  <text x="58" y="65" text-anchor="middle" font-size="14" fill="#2f8f86">1</text>
  <circle cx="88" cy="89" r="13" fill="#2f8f86" fill-opacity="0.12" stroke="#8d98a6"/>
  <text x="88" y="94" text-anchor="middle" font-size="14" fill="#2f8f86">2</text>
  <circle cx="118" cy="118" r="13" fill="#2f8f86" fill-opacity="0.12" stroke="#8d98a6"/>
  <text x="118" y="123" text-anchor="middle" font-size="14" fill="#2f8f86">3</text>
  <circle cx="148" cy="147" r="13" fill="#2f8f86" fill-opacity="0.12" stroke="#8d98a6"/>
  <text x="148" y="152" text-anchor="middle" font-size="14" fill="#2f8f86">4</text>
  <circle cx="178" cy="176" r="13" fill="#2f8f86" fill-opacity="0.12" stroke="#8d98a6"/>
  <text x="178" y="181" text-anchor="middle" font-size="14" fill="#2f8f86">5</text>
  <circle cx="208" cy="205" r="13" fill="#2f8f86" fill-opacity="0.12" stroke="#8d98a6"/>
  <text x="208" y="210" text-anchor="middle" font-size="14" fill="#2f8f86">6</text>
  <circle cx="238" cy="234" r="13" fill="#2f8f86" fill-opacity="0.12" stroke="#8d98a6"/>
  <text x="238" y="239" text-anchor="middle" font-size="14" fill="#2f8f86">7</text>

  <text x="30" y="276" text-anchor="start" font-size="13" fill="#c14a3e">høyde 6 = n − 1</text>

  <!-- Right: level by level -->
  <line x1="422.2" y1="70.4" x2="377.8" y2="129.6" stroke="#8d98a6" stroke-width="1.4"/>
  <line x1="437.8" y1="70.4" x2="482.2" y2="129.6" stroke="#8d98a6" stroke-width="1.4"/>
  <line x1="365.4" y1="152.2" x2="344.6" y2="207.8" stroke="#8d98a6" stroke-width="1.4"/>
  <line x1="374.6" y1="152.2" x2="395.4" y2="207.8" stroke="#8d98a6" stroke-width="1.4"/>
  <line x1="485.4" y1="152.2" x2="464.6" y2="207.8" stroke="#8d98a6" stroke-width="1.4"/>
  <line x1="494.6" y1="152.2" x2="515.4" y2="207.8" stroke="#8d98a6" stroke-width="1.4"/>

  <circle cx="430" cy="60" r="13" fill="#2f8f86" fill-opacity="0.12" stroke="#8d98a6"/>
  <text x="430" y="65" text-anchor="middle" font-size="14" fill="#2f8f86">4</text>
  <circle cx="370" cy="140" r="13" fill="#2f8f86" fill-opacity="0.12" stroke="#8d98a6"/>
  <text x="370" y="145" text-anchor="middle" font-size="14" fill="#2f8f86">2</text>
  <circle cx="490" cy="140" r="13" fill="#2f8f86" fill-opacity="0.12" stroke="#8d98a6"/>
  <text x="490" y="145" text-anchor="middle" font-size="14" fill="#2f8f86">6</text>
  <circle cx="340" cy="220" r="13" fill="#2f8f86" fill-opacity="0.12" stroke="#8d98a6"/>
  <text x="340" y="225" text-anchor="middle" font-size="14" fill="#2f8f86">1</text>
  <circle cx="400" cy="220" r="13" fill="#2f8f86" fill-opacity="0.12" stroke="#8d98a6"/>
  <text x="400" y="225" text-anchor="middle" font-size="14" fill="#2f8f86">3</text>
  <circle cx="460" cy="220" r="13" fill="#2f8f86" fill-opacity="0.12" stroke="#8d98a6"/>
  <text x="460" y="225" text-anchor="middle" font-size="14" fill="#2f8f86">5</text>
  <circle cx="520" cy="220" r="13" fill="#2f8f86" fill-opacity="0.12" stroke="#8d98a6"/>
  <text x="520" y="225" text-anchor="middle" font-size="14" fill="#2f8f86">7</text>

  <text x="300" y="276" text-anchor="start" font-size="13" fill="#2f8f86">høyde 2 = ⌊lg 7⌋</text>
</svg>
