<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 210" width="340" height="210" font-family="system-ui, sans-serif"><title>De ferdige nodene S, med s og x inni. En korteste vei fra s til u går fra s til x inni S, over den røde kanten fra x til y utenfor S, og videre fra y til u med vekt minst 0. Ved y står y.d er lik delta s y, og ved u står u.d er mindre enn eller lik y.d.</title><path d="M18 40 C 60 18, 150 20, 170 52 C 186 82, 168 156, 120 176 C 74 194, 22 182, 14 140 C 8 104, 4 56, 18 40 Z" fill="#2f8f86" fill-opacity="0.12" stroke="#2f8f86" stroke-width="1.5"/><text x="34" y="170" text-anchor="middle" font-size="17" font-weight="400" font-family="system-ui, sans-serif" font-style="italic" fill="#2f8f86">S</text><path d="M58 109 C 80 84, 100 88, 122 76" fill="none" stroke="#7c8795" stroke-width="1.8" stroke-dasharray="5 4"/><polygon points="122.5,75.5 116.5,83.5 112.4,75.5" fill="#7c8795"/><path d="M228 72 C 262 86, 250 122, 280 138" fill="none" stroke="#7c8795" stroke-width="1.8" stroke-dasharray="5 4"/><polygon points="281,139 271,138.2 275.6,130.5" fill="#7c8795"/><text x="276" y="104" text-anchor="start" font-size="15" font-weight="400" font-family="system-ui, sans-serif" fill="#7c8795">vekt ≥ 0</text><path d="M153.9 68.3 L189.1 64.6" fill="none" stroke="#c14a3e" stroke-width="2.6"/><polygon points="197.1,63.8 188.6,69.2 187.7,60.2" fill="#c14a3e"/><g><circle cx="44" cy="120" r="16" fill="#8d98a6" fill-opacity="0.14" stroke="#8d98a6" stroke-width="1.5"/><text x="44" y="125" text-anchor="middle" font-size="15" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#7c8795">s</text></g><g><circle cx="138" cy="70" r="16" fill="#8d98a6" fill-opacity="0.14" stroke="#8d98a6" stroke-width="1.5"/><text x="138" y="75" text-anchor="middle" font-size="15" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#7c8795">x</text></g><g><circle cx="214" cy="62" r="16" fill="#8d98a6" fill-opacity="0.14" stroke="#8d98a6" stroke-width="1.5"/><text x="214" y="67" text-anchor="middle" font-size="15" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#7c8795">y</text></g><g><circle cx="296" cy="150" r="16" fill="#8d98a6" fill-opacity="0.14" stroke="#8d98a6" stroke-width="1.5"/><text x="296" y="155" text-anchor="middle" font-size="15" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#7c8795">u</text></g><text x="214" y="32" text-anchor="middle" font-size="15" font-weight="400" font-family="system-ui, sans-serif" font-style="italic" fill="#7c8795">y.d = δ(s, y)</text><text x="296" y="190" text-anchor="middle" font-size="15" font-weight="400" font-family="system-ui, sans-serif" font-style="italic" fill="#7c8795">u.d ≤ y.d</text></svg>
