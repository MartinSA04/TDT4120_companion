  <rect x="96" y="96" width="44" height="32" fill="#c14a3e" fill-opacity="0.12" stroke="#8d98a6" stroke-opacity="0.55"/>
  <rect x="140" y="96" width="44" height="32" fill="#c14a3e" fill-opacity="0.12" stroke="#8d98a6" stroke-opacity="0.55"/>

  <text x="74" y="85" text-anchor="middle" font-size="12" fill="#2f8f86">1</text>
  <text x="118" y="85" text-anchor="middle" font-size="12" fill="#2f8f86">2</text>
  <text x="162" y="85" text-anchor="middle" font-size="12" fill="#2f8f86">3</text>
  <text x="74" y="117" text-anchor="middle" font-size="12" fill="#c14a3e">4</text>
  <text x="118" y="117" text-anchor="middle" font-size="12" fill="#c14a3e">5</text>
  <text x="162" y="117" text-anchor="middle" font-size="12" fill="#c14a3e">6</text>

  <text x="118" y="152" text-anchor="middle" font-size="10" fill="#7c8795">M[i, j]</text>

  <!-- Row-major -->
