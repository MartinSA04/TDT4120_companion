<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 220" width="560" height="220" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
  <!-- Transparent background: the Figure frame supplies the ground, and these
       mid-tone colours hold contrast on both the light and the dark theme.
       Row 1 is teal, row 2 is red, so the two linearisations read off the
       colour pattern alone. -->

  <!-- Matrix M[i, j] -->
  <text x="74" y="56" text-anchor="middle" font-size="9" fill="#7c8795">1</text>
  <text x="118" y="56" text-anchor="middle" font-size="9" fill="#7c8795">2</text>
  <text x="162" y="56" text-anchor="middle" font-size="9" fill="#7c8795">3</text>
  <text x="182" y="56" text-anchor="start" font-size="9" fill="#7c8795">j</text>
  <text x="44" y="88" text-anchor="end" font-size="9" fill="#7c8795">1</text>
  <text x="44" y="120" text-anchor="end" font-size="9" fill="#7c8795">2</text>
  <text x="44" y="140" text-anchor="end" font-size="9" fill="#7c8795">i</text>

  <rect x="52" y="64" width="44" height="32" fill="#2f8f86" fill-opacity="0.12" stroke="#8d98a6" stroke-opacity="0.55"/>
