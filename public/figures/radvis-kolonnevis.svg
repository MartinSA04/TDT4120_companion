  <rect x="480" y="140" width="36" height="30" fill="#c14a3e" fill-opacity="0.12" stroke="#8d98a6" stroke-opacity="0.55"/>
  <text x="318" y="159" text-anchor="middle" font-size="12" fill="#2f8f86">1</text>
  <text x="354" y="159" text-anchor="middle" font-size="12" fill="#c14a3e">4</text>
  <text x="390" y="159" text-anchor="middle" font-size="12" fill="#2f8f86">2</text>
