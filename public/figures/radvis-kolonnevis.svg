<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 220" width="560" height="220" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
  <!-- Transparent background: the Figure frame supplies the ground, and these
       mid-tone colours hold contrast on both the light and the dark theme.
       Row 1 is teal, row 2 is red, so the two linearisations read off the
       colour pattern alone. Text is 12px minimum in this 560-wide viewBox. -->

  <!-- Matrix M[i, j] -->
