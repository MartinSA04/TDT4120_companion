<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" width="560" height="300" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
  <!-- Transparent background: the Figure frame supplies the ground, and these
       mid-tone colours hold contrast on both the light and the dark theme.
       One bar per insertion: teal unit = the write, red units = the copying
       when the table doubles. The dashed line is the amortised bound. -->

  <text x="60" y="30" text-anchor="start" font-size="13" fill="#7c8795">operasjoner per innsetting</text>

  <!-- Copy work (red), doubling at sizes 1, 2, 4 and 8 -->
  <rect x="96" y="206" width="22" height="22" fill="#c14a3e" fill-opacity="0.5" stroke="#c14a3e" stroke-opacity="0.8" stroke-width="0.75"/>
  <rect x="124" y="184" width="22" height="44" fill="#c14a3e" fill-opacity="0.5" stroke="#c14a3e" stroke-opacity="0.8" stroke-width="0.75"/>
  <rect x="180" y="140" width="22" height="88" fill="#c14a3e" fill-opacity="0.5" stroke="#c14a3e" stroke-opacity="0.8" stroke-width="0.75"/>
  <rect x="292" y="52" width="22" height="176" fill="#c14a3e" fill-opacity="0.5" stroke="#c14a3e" stroke-opacity="0.8" stroke-width="0.75"/>
  <text x="107" y="200" text-anchor="middle" font-size="12" fill="#c14a3e">+1</text>
  <text x="135" y="178" text-anchor="middle" font-size="12" fill="#c14a3e">+2</text>
  <text x="191" y="134" text-anchor="middle" font-size="12" fill="#c14a3e">+4</text>
  <text x="303" y="46" text-anchor="middle" font-size="12" fill="#c14a3e">+8</text>

  <!-- The write itself (teal), one per insertion -->
  <rect x="68" y="228" width="22" height="22" fill="#2f8f86" fill-opacity="0.5" stroke="#2f8f86" stroke-opacity="0.8" stroke-width="0.75"/>
  <rect x="96" y="228" width="22" height="22" fill="#2f8f86" fill-opacity="0.5" stroke="#2f8f86" stroke-opacity="0.8" stroke-width="0.75"/>
  <rect x="124" y="228" width="22" height="22" fill="#2f8f86" fill-opacity="0.5" stroke="#2f8f86" stroke-opacity="0.8" stroke-width="0.75"/>
  <rect x="152" y="228" width="22" height="22" fill="#2f8f86" fill-opacity="0.5" stroke="#2f8f86" stroke-opacity="0.8" stroke-width="0.75"/>
  <rect x="180" y="228" width="22" height="22" fill="#2f8f86" fill-opacity="0.5" stroke="#2f8f86" stroke-opacity="0.8" stroke-width="0.75"/>
  <rect x="208" y="228" width="22" height="22" fill="#2f8f86" fill-opacity="0.5" stroke="#2f8f86" stroke-opacity="0.8" stroke-width="0.75"/>
  <rect x="236" y="228" width="22" height="22" fill="#2f8f86" fill-opacity="0.5" stroke="#2f8f86" stroke-opacity="0.8" stroke-width="0.75"/>
  <rect x="264" y="228" width="22" height="22" fill="#2f8f86" fill-opacity="0.5" stroke="#2f8f86" stroke-opacity="0.8" stroke-width="0.75"/>
  <rect x="292" y="228" width="22" height="22" fill="#2f8f86" fill-opacity="0.5" stroke="#2f8f86" stroke-opacity="0.8" stroke-width="0.75"/>
  <rect x="320" y="228" width="22" height="22" fill="#2f8f86" fill-opacity="0.5" stroke="#2f8f86" stroke-opacity="0.8" stroke-width="0.75"/>
  <rect x="348" y="228" width="22" height="22" fill="#2f8f86" fill-opacity="0.5" stroke="#2f8f86" stroke-opacity="0.8" stroke-width="0.75"/>
  <rect x="376" y="228" width="22" height="22" fill="#2f8f86" fill-opacity="0.5" stroke="#2f8f86" stroke-opacity="0.8" stroke-width="0.75"/>
  <rect x="404" y="228" width="22" height="22" fill="#2f8f86" fill-opacity="0.5" stroke="#2f8f86" stroke-opacity="0.8" stroke-width="0.75"/>
  <rect x="432" y="228" width="22" height="22" fill="#2f8f86" fill-opacity="0.5" stroke="#2f8f86" stroke-opacity="0.8" stroke-width="0.75"/>
  <rect x="460" y="228" width="22" height="22" fill="#2f8f86" fill-opacity="0.5" stroke="#2f8f86" stroke-opacity="0.8" stroke-width="0.75"/>
  <rect x="488" y="228" width="22" height="22" fill="#2f8f86" fill-opacity="0.5" stroke="#2f8f86" stroke-opacity="0.8" stroke-width="0.75"/>

  <!-- Amortised bound -->
  <line x1="56" y1="184" x2="514" y2="184" stroke="#c14a3e" stroke-width="1.2" stroke-dasharray="4 4" opacity="0.8"/>
  <text x="514" y="178" text-anchor="end" font-size="12" fill="#c14a3e">3 operasjoner amortisert</text>

  <!-- Axis -->
  <line x1="56" y1="250" x2="514" y2="250" stroke="#8d98a6" stroke-width="1"/>
  <text x="79" y="270" text-anchor="middle" font-size="12" fill="#7c8795">1</text>
  <text x="107" y="270" text-anchor="middle" font-size="12" fill="#7c8795">2</text>
  <text x="135" y="270" text-anchor="middle" font-size="12" fill="#7c8795">3</text>
  <text x="163" y="270" text-anchor="middle" font-size="12" fill="#7c8795">4</text>
  <text x="191" y="270" text-anchor="middle" font-size="12" fill="#7c8795">5</text>
  <text x="219" y="270" text-anchor="middle" font-size="12" fill="#7c8795">6</text>
  <text x="247" y="270" text-anchor="middle" font-size="12" fill="#7c8795">7</text>
  <text x="275" y="270" text-anchor="middle" font-size="12" fill="#7c8795">8</text>
  <text x="303" y="270" text-anchor="middle" font-size="12" fill="#7c8795">9</text>
  <text x="331" y="270" text-anchor="middle" font-size="12" fill="#7c8795">10</text>
  <text x="359" y="270" text-anchor="middle" font-size="12" fill="#7c8795">11</text>
  <text x="387" y="270" text-anchor="middle" font-size="12" fill="#7c8795">12</text>
  <text x="415" y="270" text-anchor="middle" font-size="12" fill="#7c8795">13</text>
  <text x="443" y="270" text-anchor="middle" font-size="12" fill="#7c8795">14</text>
  <text x="471" y="270" text-anchor="middle" font-size="12" fill="#7c8795">15</text>
  <text x="499" y="270" text-anchor="middle" font-size="12" fill="#7c8795">16</text>
  <text x="285" y="292" text-anchor="middle" font-size="13" fill="#7c8795">innsetting nr.</text>
</svg>
