<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 244" width="560" height="244" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
  <!-- Transparent background: the Figure frame supplies the ground, and these
       mid-tone colours hold contrast on both the light and the dark theme.
       The same tree twice: node 7 has the children 5 and 6, and 5 has the
       four children 1, 2, 3, 4. Left, one pointer per child; right, only a
       first-child pointer (teal, downwards) and a next-sibling pointer (red,
       sideways), so the children of a node form a linked list. -->
  <defs>
    <marker id="fb-graa" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#8d98a6"/>
    </marker>
    <marker id="fb-teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#2f8f86"/>
    </marker>
    <marker id="fb-rod" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#c14a3e"/>
    </marker>
  </defs>

  <text x="30" y="26" text-anchor="start" font-size="13" fill="#7c8795">én peker til hvert barn</text>
  <text x="300" y="26" text-anchor="start" font-size="13" fill="#7c8795">første barn og neste søsken</text>

  <!-- Left tree: child pointers -->
  <line x1="147.0" y1="72.2" x2="108.0" y2="121.8" stroke="#8d98a6" stroke-width="1.4" marker-end="url(#fb-graa)"/>
  <line x1="163.0" y1="72.2" x2="202.0" y2="121.8" stroke="#8d98a6" stroke-width="1.4" marker-end="url(#fb-graa)"/>
  <line x1="91.1" y1="141.5" x2="42.9" y2="192.5" stroke="#8d98a6" stroke-width="1.4" marker-end="url(#fb-graa)"/>
  <line x1="96.1" y1="144.4" x2="81.9" y2="189.6" stroke="#8d98a6" stroke-width="1.4" marker-end="url(#fb-graa)"/>
  <line x1="103.9" y1="144.4" x2="118.1" y2="189.6" stroke="#8d98a6" stroke-width="1.4" marker-end="url(#fb-graa)"/>
  <line x1="108.9" y1="141.5" x2="157.1" y2="192.5" stroke="#8d98a6" stroke-width="1.4" marker-end="url(#fb-graa)"/>

  <circle cx="155" cy="62" r="13" fill="#2f8f86" fill-opacity="0.12" stroke="#8d98a6"/>
  <text x="155" y="67" text-anchor="middle" font-size="14" fill="#2f8f86">7</text>
  <circle cx="100" cy="132" r="13" fill="#2f8f86" fill-opacity="0.12" stroke="#8d98a6"/>
  <text x="100" y="137" text-anchor="middle" font-size="14" fill="#2f8f86">5</text>
  <circle cx="210" cy="132" r="13" fill="#2f8f86" fill-opacity="0.12" stroke="#8d98a6"/>
  <text x="210" y="137" text-anchor="middle" font-size="14" fill="#2f8f86">6</text>
  <circle cx="34" cy="202" r="13" fill="#2f8f86" fill-opacity="0.12" stroke="#8d98a6"/>
  <text x="34" y="207" text-anchor="middle" font-size="14" fill="#2f8f86">1</text>
  <circle cx="78" cy="202" r="13" fill="#2f8f86" fill-opacity="0.12" stroke="#8d98a6"/>
  <text x="78" y="207" text-anchor="middle" font-size="14" fill="#2f8f86">2</text>
  <circle cx="122" cy="202" r="13" fill="#2f8f86" fill-opacity="0.12" stroke="#8d98a6"/>
  <text x="122" y="207" text-anchor="middle" font-size="14" fill="#2f8f86">3</text>
  <circle cx="166" cy="202" r="13" fill="#2f8f86" fill-opacity="0.12" stroke="#8d98a6"/>
  <text x="166" y="207" text-anchor="middle" font-size="14" fill="#2f8f86">4</text>

  <!-- Right tree: first child (teal) and next sibling (red) -->
  <line x1="437.0" y1="72.2" x2="398.0" y2="121.8" stroke="#2f8f86" stroke-width="1.6" marker-end="url(#fb-teal)"/>
  <line x1="381.1" y1="141.5" x2="332.9" y2="192.5" stroke="#2f8f86" stroke-width="1.6" marker-end="url(#fb-teal)"/>
  <line x1="403" y1="132" x2="487" y2="132" stroke="#c14a3e" stroke-width="1.6" marker-end="url(#fb-rod)"/>
  <line x1="337" y1="202" x2="355" y2="202" stroke="#c14a3e" stroke-width="1.6" marker-end="url(#fb-rod)"/>
  <line x1="381" y1="202" x2="399" y2="202" stroke="#c14a3e" stroke-width="1.6" marker-end="url(#fb-rod)"/>
  <line x1="425" y1="202" x2="443" y2="202" stroke="#c14a3e" stroke-width="1.6" marker-end="url(#fb-rod)"/>

  <circle cx="445" cy="62" r="13" fill="#2f8f86" fill-opacity="0.12" stroke="#8d98a6"/>
  <text x="445" y="67" text-anchor="middle" font-size="14" fill="#2f8f86">7</text>
  <circle cx="390" cy="132" r="13" fill="#2f8f86" fill-opacity="0.12" stroke="#8d98a6"/>
  <text x="390" y="137" text-anchor="middle" font-size="14" fill="#2f8f86">5</text>
  <circle cx="500" cy="132" r="13" fill="#2f8f86" fill-opacity="0.12" stroke="#8d98a6"/>
  <text x="500" y="137" text-anchor="middle" font-size="14" fill="#2f8f86">6</text>
  <circle cx="324" cy="202" r="13" fill="#2f8f86" fill-opacity="0.12" stroke="#8d98a6"/>
  <text x="324" y="207" text-anchor="middle" font-size="14" fill="#2f8f86">1</text>
  <circle cx="368" cy="202" r="13" fill="#2f8f86" fill-opacity="0.12" stroke="#8d98a6"/>
  <text x="368" y="207" text-anchor="middle" font-size="14" fill="#2f8f86">2</text>
  <circle cx="412" cy="202" r="13" fill="#2f8f86" fill-opacity="0.12" stroke="#8d98a6"/>
  <text x="412" y="207" text-anchor="middle" font-size="14" fill="#2f8f86">3</text>
  <circle cx="456" cy="202" r="13" fill="#2f8f86" fill-opacity="0.12" stroke="#8d98a6"/>
  <text x="456" y="207" text-anchor="middle" font-size="14" fill="#2f8f86">4</text>

  <!-- Legend -->
  <line x1="300" y1="234" x2="324" y2="234" stroke="#2f8f86" stroke-width="1.6" marker-end="url(#fb-teal)"/>
  <text x="332" y="238" text-anchor="start" font-size="12" fill="#7c8795">første barn</text>
  <line x1="420" y1="234" x2="444" y2="234" stroke="#c14a3e" stroke-width="1.6" marker-end="url(#fb-rod)"/>
  <text x="452" y="238" text-anchor="start" font-size="12" fill="#7c8795">neste søsken</text>
</svg>
