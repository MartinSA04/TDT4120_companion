<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 168" width="340" height="168" font-family="system-ui, sans-serif"><title>To utvalg av aktiviteter på en tidsakse fra 0 til 16. Øverst en optimal løsning: a2 fra 3 til 5, a4 fra 5 til 7, a9 fra 8 til 12 og a11 fra 12 til 16. Under den samme løsningen med a1, fra 1 til 4, i stedet for a2. En stiplet linje ved tid 5 står der a2 slutter og a4 starter, og a1 slutter før den.</title><text x="18" y="18" text-anchor="start" font-size="15" fill="#7c8795">En optimal løsning</text><rect x="76.4" y="26" width="36.2" height="26" rx="4" fill="#c14a3e" fill-opacity="0.2" stroke="#c14a3e" stroke-width="2"/><text x="94.5" y="44" text-anchor="middle" font-size="15" font-weight="600" fill="#c14a3e">a2</text><rect x="114.6" y="26" width="36.3" height="26" rx="4" fill="#74902a" fill-opacity="0.2" stroke="#74902a" stroke-width="2"/><text x="132.75" y="44" text-anchor="middle" font-size="15" font-weight="600" fill="#74902a">a4</text><rect x="172" y="26" width="74.5" height="26" rx="4" fill="#74902a" fill-opacity="0.2" stroke="#74902a" stroke-width="2"/><text x="209.25" y="44" text-anchor="middle" font-size="15" font-weight="600" fill="#74902a">a9</text><rect x="248.5" y="26" width="74.5" height="26" rx="4" fill="#74902a" fill-opacity="0.2" stroke="#74902a" stroke-width="2"/><text x="285.75" y="44" text-anchor="middle" font-size="15" font-weight="600" fill="#74902a">a11</text><text x="18" y="88" text-anchor="start" font-size="15" fill="#7c8795">Med a1 i stedet for a2</text><rect x="38.1" y="96" width="55.4" height="26" rx="4" fill="#c14a3e" fill-opacity="0.2" stroke="#c14a3e" stroke-width="2"/><text x="65.8" y="114" text-anchor="middle" font-size="15" font-weight="600" fill="#c14a3e">a1</text><rect x="114.6" y="96" width="36.3" height="26" rx="4" fill="#74902a" fill-opacity="0.2" stroke="#74902a" stroke-width="2"/><text x="132.75" y="114" text-anchor="middle" font-size="15" font-weight="600" fill="#74902a">a4</text><rect x="172" y="9