<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 280" width="560" height="280" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
  <!-- Transparent background: the Figure frame supplies the ground, and these
       mid-tone colours hold contrast on both the light and the dark theme.
       Solid red arrows are the work the algorithm does; dashed arrows are the
       unknown (grey) and the assumed (teal). Text is 12px minimum. -->
  <defs>
    <marker id="pil-graa" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#8d98a6"/>
    </marker>
    <marker id="pil-roed" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#c14a3e"/>
    </marker>
    <marker id="pil-teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#2f8f86"/>
    </marker>
  </defs>

  <!-- Boxes -->
  <rect x="40" y="40" width="125" height="40" rx="6" fill="#9aa0a6" fill-opacity="0.08" stroke="#8d98a6"/>
  <text x="102.5" y="65" text-anchor="middle" font-size="14" fill="#7c8795">instans</text>

  <rect x="395" y="40" width="125" height="40" rx="6" fill="#9aa0a6" fill-opacity="0.08" stroke="#8d98a6"/>
  <text x="457.5" y="65" text-anchor="middle" font-size="14" fill="#7c8795">svar</text>

  <rect x="40" y="200" width="125" height="40" rx="6" fill="#9aa0a6" fill-opacity="0.08" stroke="#8d98a6"/>
  <text x="102.5" y="225" text-anchor="middle" font-size="14" fill="#7c8795">delinstans</text>

  <rect x="395" y="200" width="125" height="40" rx="6" fill="#9aa0a6" fill-opacity="0.08" stroke="#8d98a6"/>
  <text x="457.5" y="225" text-anchor="middle" font-size="14" fill="#7c8795">delsvar</text>

  <!-- Top: the solution we want (unknown) -->
  <line x1="170" y1="60" x2="388" y2="60" stroke="#8d98a6" stroke-width="1.4" stroke-dasharray="5 5" marker-end="url(#pil-graa)"/>
  <text x="279" y="48" text-anchor="middle" font-size="13" fill="#8d98a6">løsning</text>

  <!-- Left: decompose (work we do) -->
  <line x1="102.5" y1="84" x2="102.5" y2="193" stroke="#c14a3e" stroke-width="1.6" marker-end="url(#pil-roed)"/>
  <text x="94" y="145" text-anchor="end" font-size="13" fill="#c14a3e">dekomponer</text>

  <!-- Bottom: assumed sub-solution (induction hypothesis) -->
  <line x1="170" y1="220" x2="388" y2="220" stroke="#2f8f86" stroke-width="1.4" stroke-dasharray="5 5" marker-end="url(#pil-teal)"/>
  <text x="279" y="190" text-anchor="middle" font-size="13" fill="#2f8f86">antatt delløsning</text>
  <text x="279" y="207" text-anchor="middle" font-size="13" fill="#2f8f86">(induksjonshypotesen)</text>

  <!-- Right: combine (work we do) -->
  <line x1="457.5" y1="196" x2="457.5" y2="87" stroke="#c14a3e" stroke-width="1.6" marker-end="url(#pil-roed)"/>
  <text x="466" y="145" text-anchor="start" font-size="13" fill="#c14a3e">kombiner</text>
</svg>
