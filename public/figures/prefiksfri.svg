<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 218" width="340" height="218" font-family="system-ui, sans-serif"><title>To koder tegnet som kodetrær, 0 til venstre og 1 til høyre. Til venstre A = 0, B = 01 og C = 1: A står på veien til B, og 01 kan leses som AC eller som B. Til høyre A = 0, B = 10 og C = 11: alle tegnene står i løvnoder, og en bitstreng kan bare leses på én måte.</title><line x1="79.6" y1="34.4" x2="55" y2="73" stroke="#7c8795" stroke-width="1.6"/><text x="58.3" y="56.7" text-anchor="middle" font-size="15" fill="#7c8795">0</text><line x1="90.4" y1="34.4" x2="115" y2="73" stroke="#7c8795" stroke-width="1.6"/><text x="111.7" y="56.7" text-anchor="middle" font-size="15" fill="#7c8795">1</text><line x1="53.3" y1="92.5" x2="77.1" y2="131" stroke="#7c8795" stroke-width="1.6"/><text x="74.2" y="114.7" text-anchor="middle" font-size="15" fill="#7c8795">1</text><circle cx="85" cy="26" r="10" fill="#7c8795" fill-opacity="0.08" stroke="#7c8795" stroke-width="1.6"/><rect x="34" y="71" width="28" height="26" rx="5" fill="#c14a3e" fill-opacity="0.2" stroke="#c14a3e" stroke-width="2"/><text x="48" y="90" text-anchor="middle" font-size="16" font-weight="600" fill="#c14a3e">A</text><rect x="70" y="129" width="28" height="26" rx="5" fill="#7c8795" fill-opacity="0.08" stroke="#7c8795" stroke-width="1.6"/><text x="84" y="148" text-anchor="middle" font-size="16" font-weight="600" fill="#7c8795">B</text><rect x="108" y="71" width="28" height="26" rx="5" fill="#7c8795" fill-opacity="0.08" stroke="#7c8795" stroke-width="1.6"/><text x="122" y="90" text-anchor="middle" font-size="16" font-weight="600" fill="#7c8795">C</text><text x="85" y="186" text-anchor="middle" font-size="15" fill="#7c8795">A = 0, B = 01, C = 1</text><text x="85" y="208" text-anchor="middle" font-size="15" fill="#c14a3e">01 er AC eller B</text><line x1="249.6" y1="34.4" x2="225" y2="73" stroke="#7c8795" stroke-width="1.6"/><text x="228.3" y="56.7" text-anchor="middle" font-size="15" fill="#7c8795">0</text><line x1="260.4" y1="34.4" x2="285" y2="73" stroke="#7c8795" stroke-width="1.6"/><text x="281.7" y="56.7" text-anchor="middle" font-size="15" fill="#7c8795">1</text><line x1="287.4" y1="92.9" x2="268" y2="130.5" stroke="#7c8795" stroke-width="1.6"/><text x="268.7" y="114.7" text-anchor="middle" font-size="15" fill="#7c8795">0</text><line x1="296.1" y1="93.1" x2="312.7" y2="130.1" stroke="#7c8795" stroke-width="1.6"/><text x="313.4" y="114.6" text-anchor="middle" font-size="15" fill="#7c8795">1</text><circle cx="255" cy="26" r="10" fill="#7c8795" fill-opacity="0.08" stroke="#7c8795" stroke-width="1.6"/><circle cx="292" cy="84" r="10" fill="#7c8795" fill-opacity="0.08" stroke="#7c8795" stroke-width="1.6"/><rect x="204" y="71" width="28" height="26" rx="5" fill="#2f8f86" fill-opacity="0.2" stroke="#2f8f86" stroke-width="2"/><text x="218" y="90" text-anchor="middle" font-size="16" font-weight="600" fill="#2f8f86">A</text><rect x="248" y="129" width="28" height="26" rx="5" fill="#2f8f86" fill-opacity="0.2" stroke="#2f8f86" stroke-width="2"/><text x="262" y="148" text-anchor="middle" font-size="16" font-weight="600" fill="#2f8f86">B</text><rect x="304" y="129" width="28" height="26" rx="5" fill="#2f8f86" fill-opacity="0.2" stroke="#2f8f86" stroke-width="2"/><text x="318" y="148" text-anchor="middle" font-size="16" font-weight="600" fill="#2f8f86">C</text><text x="255" y="186" text-anchor="middle" font-size="15" fill="#7c8795">A = 0, B = 10, C = 11</text><text x="255" y="208" text-anchor="middle" font-size="15" fill="#2f8f86">bare én måte å lese</text></svg>
