[project]
name = "algorithm-visualizer"
version = "0.1.0"
description = "A modular algorithm visualizer with code-position and data-state views."
requires-python = ">=3.12"
dependencies = [
    "pyside6>=6.7",
]

[project.scripts]
algorithm-visualizer = "algorithm_visualizer.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/algorithm_visualizer"]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "ty>=0.0.1a1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ty.environment]
python-version = "3.12"
